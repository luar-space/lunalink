name: Traceability

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'cpp/**'
      - 'docs/**'
      - 'scripts/verify_traceability.py'
      - '.github/workflows/traceability.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'docs/**'
      - 'scripts/verify_traceability.py'
      - '.github/workflows/traceability.yml'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  traceability:
    name: Requirement Traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run traceability scanner
        run: python3 scripts/verify_traceability.py --strict
      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: traceability-report
          path: docs/assurance/evidence/traceability.json
