name: Traceability

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'cpp/**'
      - 'docs/**'
      - 'scripts/verify_traceability.py'
      - '.github/workflows/traceability.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'docs/**'
      - 'scripts/verify_traceability.py'
      - '.github/workflows/traceability.yml'

jobs:
  traceability:
    name: Requirement Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run traceability scanner
        run: python3 scripts/verify_traceability.py --strict
      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: traceability-report
          path: docs/assurance/private/evidence/traceability.json
