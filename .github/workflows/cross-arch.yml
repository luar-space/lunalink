name: Cross-Architecture

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'Dockerfile.cross-arch'
      - '.github/workflows/cross-arch.yml'

# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cross-arch:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/s390x]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build & test (${{ matrix.platform }})
        run: >
          docker buildx build
          --platform ${{ matrix.platform }}
          --progress=plain
          --no-cache
          -f Dockerfile.cross-arch .
