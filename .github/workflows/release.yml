name: Release

# Builds the source distribution and binary wheels, attaches them to the
# GitHub release, and publishes to PyPI.
#
# Triggered by pushing a PEP 440 release tag:
#
#     git tag -a v1.2.3 -m "Release 1.2.3" && git push origin v1.2.3
#
# PyPI publication uses trusted publishing (OIDC), so there is no API token
# stored in this repository. It requires a pending publisher to be configured
# once at https://pypi.org/manage/account/publishing/ for project "lunalink",
# this repository, workflow "release.yml", environment "pypi".
#
# Run it with workflow_dispatch to exercise the build without publishing.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, so a shallow clone
          # would produce 0.0.0.dev0 instead of the release version.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Verify the sdist carries a real version
        run: |
          name=$(ls dist/*.tar.gz)
          echo "built: $name"
          case "$name" in
            *0.0.0*) echo "::error::version did not resolve from git tags"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One runner per architecture we ship, so every wheel is built
        # natively: x86_64 and arm64 Linux, Intel and Apple Silicon macOS,
        # and x86_64 Windows.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        # Target versions, the skip list and the wheel test command live in
        # [tool.cibuildwheel] in pyproject.toml. Architecture is overridden to
        # "native" here because each matrix entry is already a runner of the
        # architecture it builds for, so emulation would only make it slower.
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  github-release:
    name: Attach to GitHub release
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Upload artefacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

  pypi:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/lunalink
    permissions:
      # Trusted publishing: the OIDC token replaces a stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
