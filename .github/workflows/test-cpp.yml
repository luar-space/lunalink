name: C++ Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'

jobs:
  build:
    name: Build (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: test-cpp
      - name: Configure & Build
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: cpp-debug-build
          path: |
            build/test_lunalink
            build/lunalink_swifi_tests
          retention-days: 1

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: cpp-debug-build
          path: build/
      - name: Run unit tests
        run: |
          chmod +x build/test_lunalink
          build/test_lunalink "~[performance]" --reporter console

  swifi:
    name: SWIFI fault-injection tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: cpp-debug-build
          path: build/
      - name: Run SWIFI tests
        run: |
          chmod +x build/lunalink_swifi_tests
          build/lunalink_swifi_tests \
            --reporter junit::out=build/swifi_results.xml \
            --reporter console
          python3 scripts/swifi_report.py --xml build/swifi_results.xml
      - name: Upload SWIFI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swifi-evidence
          path: |
            build/swifi_results.xml
            docs/assurance/private/evidence/swifi_results.json
