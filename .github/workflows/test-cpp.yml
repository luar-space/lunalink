name: C++ Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: test-cpp
      - name: Configure & Build
        run: |
          # LUNALINK_FAULT_INJECTION=ON is what builds lunalink_swifi_tests
          # (CMakeLists.txt:266); without it the swifi job downloads an
          # artifact that never contained the binary and fails at chmod.
          # Mirrors `task swifi`.
          cmake -B build -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLUNALINK_FAULT_INJECTION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Verify both binaries exist
        run: |
          test -x build/test_lunalink || { echo "missing test_lunalink"; exit 1; }
          test -x build/lunalink_swifi_tests || { echo "missing lunalink_swifi_tests"; exit 1; }
      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: cpp-debug-build
          path: |
            build/test_lunalink
            build/lunalink_swifi_tests
          retention-days: 1

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: cpp-debug-build
          path: build/
      # The routing contract (scripts/lint_test_tags.py) is "test-cpp runs
      # ~[slow], acceptance runs everything", and `task test-cpp` honours it.
      # Restating it as a list of five tags drifted: [fft_bench][slow] was
      # landing in this fast job. 230 cases under the old filter, 229 under
      # ~[slow] — the FFT microbench is the only difference.
      - name: Check every test case declares a tag
        run: python3 scripts/lint_test_tags.py
      - name: Run unit tests
        run: |
          chmod +x build/test_lunalink
          mkdir -p build/test-results
          build/test_lunalink "~[slow]" \
            --abort --rng-seed 42 \
            --reporter console \
            --reporter "junit::out=build/test-results/lunalink.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: build/test-results/
          retention-days: 90

  swifi:
    name: SWIFI fault-injection tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: cpp-debug-build
          path: build/
      - name: Run SWIFI tests
        run: |
          chmod +x build/lunalink_swifi_tests
          build/lunalink_swifi_tests \
            --reporter junit::out=build/swifi_results.xml \
            --reporter console
          python3 scripts/swifi_report.py --xml build/swifi_results.xml
      - name: Upload SWIFI evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swifi-evidence
          path: |
            build/swifi_results.xml
            docs/assurance/evidence/swifi_results.json
