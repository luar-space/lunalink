name: Lint

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: lint
      # clang-format comes from the pinned dev dependency (pyproject.toml), not
      # from apt: Ubuntu's is a different major version and formats differently.
      - name: Run lint checks
        run: task lint-check
      - name: Check C++ formatting
        run: task format-cpp-check
      - name: Check build flags (S10 gate)
        run: |
          # Build to generate compile_commands.json first
          sudo apt-get install -y ninja-build
          cmake -B build/flags -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/flags --parallel
          uv run python scripts/check_build_flags.py build/flags/compile_commands.json
      - name: Capture cppcheck report
        if: always()
        run: |
          mkdir -p build/reports
          cppcheck --std=c++20 --platform=unix64 \
            --enable=all \
            --inconclusive \
            --inline-suppr \
            --suppressions-list=cppcheck.suppressions \
            --template='{file}:{line}: [{severity}] {id}: {message}' \
            cpp/include/ cpp/codes/ cpp/encoding/ cpp/messages/ cpp/signal/ cpp/platform/ \
            2>&1 | tee /tmp/cppcheck_output.txt || true
          python3 - <<'EOF'
          import datetime
          with open('/tmp/cppcheck_output.txt') as f:
              content = f.read()
          with open('build/reports/cppcheck_report.rst', 'w') as f:
              f.write('Cppcheck Static Analysis Report\n')
              f.write('================================\n\n')
              f.write(f'.. note:: Generated by CI on {datetime.date.today()}.\n\n')
              f.write('Configuration: ``cppcheck.cfg`` with ``cppcheck.suppressions``\n\n')
              f.write('.. code-block:: text\n\n')
              for line in content.splitlines():
                  f.write(f'   {line}\n')
          EOF
      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cppcheck-report
          path: build/reports/cppcheck_report.rst
