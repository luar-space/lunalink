name: Validate OSS Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/export_oss.py'
      - 'docs/**'
      - '.github/workflows/validate-export.yml'
  # TODO: re-enable pull_request trigger after restructure PR is merged
  #   pull_request:
  #     paths:
  #       - 'scripts/export_oss.py'
  #       - 'docs/**'
  #       - '.github/workflows/validate-export.yml'


jobs:
  validate-export:
    name: Validate OSS Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev

      - name: Run OSS export
        run: uv run python scripts/export_oss.py --output-dir /tmp/oss-export

      # ---- Integrity checks on exported tree ----

      - name: Verify no private/ directories remain
        run: |
          if find /tmp/oss-export -type d -name private | grep -q .; then
            echo "FAIL: private/ directories found in export:"
            find /tmp/oss-export -type d -name private
            exit 1
          fi
          echo "PASS: no private/ directories in export"

      - name: Verify no confidential markers remain
        run: |
          # Reconstruct the marker to avoid self-match
          MARKER="[[Confidential - Not for OpenSource]]"
          if grep -rF "$MARKER" /tmp/oss-export/ --include='*.rst' --include='*.md' --include='*.py' --include='*.yml' --include='*.toml' --include='*.cfg' --include='*.hpp' --include='*.cpp' 2>/dev/null; then
            echo "FAIL: confidential markers found in export"
            exit 1
          fi
          echo "PASS: no confidential markers in export"

      - name: Verify no private-begin/end blocks remain
        run: |
          BEGIN="[[private-begin]]"
          END="[[private-end]]"
          FOUND=0
          if grep -rF "$BEGIN" /tmp/oss-export/ 2>/dev/null; then
            echo "FAIL: private-begin markers found in export"
            FOUND=1
          fi
          if grep -rF "$END" /tmp/oss-export/ 2>/dev/null; then
            echo "FAIL: private-end markers found in export"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "PASS: no private block markers in export"

      - name: Verify no CLAUDE.md in export
        run: |
          if find /tmp/oss-export -name "CLAUDE.md" | grep -q .; then
            echo "FAIL: CLAUDE.md found in export"
            exit 1
          fi
          echo "PASS: no CLAUDE.md in export"

      - name: Verify README.md exists
        run: |
          if [ ! -f /tmp/oss-export/README.md ]; then
            echo "FAIL: README.md not found in export"
            exit 1
          fi
          echo "PASS: README.md present"

      - name: Verify no shaping/ docs in export
        run: |
          if find /tmp/oss-export -type d -name shaping | grep -q .; then
            echo "FAIL: shaping/ directories found in export"
            exit 1
          fi
          echo "PASS: no shaping/ directories in export"

      - name: Sphinx build in exported tree (zero warnings)
        run: |
          cd /tmp/oss-export
          uv sync --group dev
          uv run python -m sphinx -b html docs/ docs/_build/html -W

      - name: Upload export for inspection
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: oss-export
          path: /tmp/oss-export
          retention-days: 7
