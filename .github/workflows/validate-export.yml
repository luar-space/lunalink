#
# Builds and tests ONLY what is committed.
#
# Every other workflow checks out the repo and therefore sees exactly the
# tracked tree already — but a local `task ci-checks` run does not, because it
# uses the developer's working tree. This workflow is the CI-side counterpart
# of `scripts/validate_export.sh` and additionally guards the toctree
# completeness check, so a documentation page that is referenced but never
# committed fails the build rather than 404-ing on the published site.
name: validate-export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Validate the committed tree
        run: scripts/validate_export.sh "${{ github.sha }}"
