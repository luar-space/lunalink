name: Docs Check

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'docs/**'
      - 'src/**'
      - '*.rst'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - '*.rst'
      - '.github/workflows/docs-check.yml'


jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task docs-build
