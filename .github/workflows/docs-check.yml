name: Docs Check

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'docs/**'
      - 'src/**'
      - '*.rst'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - '*.rst'
      - '.github/workflows/docs-check.yml'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install doxygen and pandoc
        # Breathe renders the C++ API from Doxygen XML; task docs-build
        # generates it before Sphinx runs. nbsphinx needs pandoc to render
        # the notebooks' Markdown cells.
        run: sudo apt-get install -y doxygen pandoc
      - run: task docs-build
