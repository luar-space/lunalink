name: WCET Profile

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  wcet:
    name: WCET benchmark profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: wcet-release
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (Release)
        run: |
          cmake -B build/wcet -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/wcet --parallel
      - name: Run BENCHMARK tests (timing only)
        run: |
          build/wcet/test_lunalink "[benchmark]" \
            --reporter console::out=/tmp/wcet_console.txt \
            --reporter xml::out=/tmp/wcet_results.xml
      - name: Run BER simulations
        run: |
          build/wcet/test_lunalink "[performance]~[benchmark]" \
            --reporter console::out=/tmp/ber_console.txt
      - name: Fetch benchmark history
        run: |
          git show origin/gh-pages:dev/bench/data.js > /tmp/history.js 2>/dev/null || true
      - name: Parse results and generate RST artifact
        run: |
          python3 scripts/wcet_report.py \
            --xml /tmp/wcet_results.xml \
            --console /tmp/wcet_console.txt \
            --output /tmp/wcet_profile.rst \
            --bench-json /tmp/bench.json \
            --history /tmp/history.js
      - name: Upload WCET report
        uses: actions/upload-artifact@v5
        with:
          name: wcet-profile
          path: /tmp/wcet_profile.rst
      - name: Track benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
