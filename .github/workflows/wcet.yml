name: WCET Profile

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wcet:
    name: WCET benchmark profile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: wcet-release
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (Release)
        run: |
          cmake -B build/performance -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/performance --parallel
      - name: Run BENCHMARK tests (timing only)
        run: |
          build/performance/test_lunalink "[wcet]" \
            --reporter console::out=/tmp/wcet_console.txt \
            --reporter xml::out=/tmp/wcet_results.xml
      - name: Show benchmark output
        # Both reporters write to files, so a failure above otherwise reports
        # only "exit code 1" with no indication of which budget was missed.
        # Catch2 prints failures before the benchmark tables, so tailing the
        # file hides exactly the part that matters: grep the failure block
        # first, then show the tail for context.
        if: always()
        run: |
          grep -B4 -A12 -E "FAILED|with expansion" /tmp/wcet_console.txt || true
          echo "--- tail ---"
          tail -30 /tmp/wcet_console.txt || true
      - name: Upload WCET console and XML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wcet-raw-output
          path: |
            /tmp/wcet_console.txt
            /tmp/wcet_results.xml
          retention-days: 7
      - name: Run BER simulations
        run: |
          build/performance/test_lunalink "[channel]" \
            --reporter console::out=/tmp/ber_console.txt
      - name: Fetch benchmark history
        run: |
          git show origin/gh-pages:dev/bench/data.js > /tmp/history.js 2>/dev/null || true
      - name: Parse results and generate RST artifact
        run: |
          python3 scripts/performance_report.py \
            --xml /tmp/wcet_results.xml \
            --console /tmp/wcet_console.txt \
            --output /tmp/wcet_profile.rst \
            --bench-json /tmp/bench.json \
            --history /tmp/history.js
      - name: Upload WCET report
        uses: actions/upload-artifact@v5
        with:
          name: wcet-profile
          path: /tmp/wcet_profile.rst
      - name: Check for a benchmark history branch
        id: ghpages
        # The action clones gh-pages and dies with "couldn't find remote ref
        # gh-pages" where the branch does not exist yet — a fork, or this
        # repository. The WCET measurement above has already passed at that
        # point; trend tracking is an extra, not a gate.
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No gh-pages branch: skipping benchmark trend tracking."
          fi
      - name: Track benchmark history
        if: steps.ghpages.outputs.present == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
