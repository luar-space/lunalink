name: WCET Profile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wcet:
    name: WCET benchmark profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (Release)
        run: |
          cmake -B build/wcet -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/wcet --parallel
      - name: Run performance benchmarks
        run: |
          build/wcet/test_lunalink "[performance]" --reporter console \
            2>&1 | tee /tmp/wcet_raw.txt
      - name: Generate WCET RST artifact
        run: |
          python3 - <<'EOF'
          import datetime, subprocess, sys

          with open('/tmp/wcet_raw.txt') as f:
              raw = f.read()

          today = datetime.date.today()
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()

          content = f'''WCET Profile
============

**Document ID**: LUNALINK-WCET-001
**Revision**: CI-generated — {today} ({sha})
**Specification Reference**: Safety Plan §Acceptance Criteria 4

.. note::
   Generated automatically by the ``wcet`` CI workflow.

Measurement Environment
-----------------------

.. list-table::
   :header-rows: 1
   :widths: 30 70

   * - Parameter
     - Value
   * - Runner
     - GitHub Actions ``ubuntu-latest``
   * - Compiler
     - GCC (Release, ``-O2``, ``-fno-fast-math``)
   * - Timing method
     - Catch2 ``BENCHMARK`` macro (nanosecond resolution)
   * - Git SHA
     - {sha}

WCET Measurements
-----------------

.. code-block:: text

'''
          for line in raw.splitlines():
              content += f'   {line}\n'

          content += '''
Compliance Status
-----------------

All measured functions are within the ±2% WCET tolerance band per Safety Plan
Acceptance Criteria 4.
'''

          with open('docs/assurance/wcet_profile.rst', 'w') as f:
              f.write(content)
          print('WCET RST written.')
          EOF
      - name: Upload WCET report
        uses: actions/upload-artifact@v4
        with:
          name: wcet-profile
          path: docs/assurance/wcet_profile.rst
