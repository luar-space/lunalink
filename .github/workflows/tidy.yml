name: Clang Tidy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: tidy
      - uses: arduino/setup-task@v3
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: clang-tidy --version
      - name: Run clang-tidy
        run: CC=clang CXX=clang++ task tidy 2>&1 | tee /tmp/clang_tidy_output.txt
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Capture clang-tidy report
        if: always()
        run: |
          mkdir -p build/reports
          uv run python3 - <<'EOF'
          import datetime
          with open('/tmp/clang_tidy_output.txt') as f:
              content = f.read()
          with open('build/reports/static_analysis_report.rst', 'w') as f:
              # `:orphan:` because docs-pages.yml publishes this page without
              # it ever being committed, so it cannot sit in a toctree.
              f.write(':orphan:\n\n')
              f.write('Clang-Tidy Static Analysis Report\n')
              f.write('==================================\n\n')
              f.write(f'.. note:: Generated by CI on {datetime.date.today()}.\n\n')
              f.write('.. code-block:: text\n\n')
              for line in content.splitlines():
                  f.write(f'   {line}\n')
          EOF
      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-report
          path: build/reports/static_analysis_report.rst

  clang-sa:
    name: Clang Static Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools
        # clang-tools provides scan-build, which `task clang-sa` requires;
        # without it the job failed with "scan-build not found".
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tools
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: clang-sa
      - uses: arduino/setup-task@v3
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Clang Static Analyzer
        run: task clang-sa
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
