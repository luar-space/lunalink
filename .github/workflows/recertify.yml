name: Recertification

# ---------------------------------------------------------------------------
# Triggered ONLY on explicit demand — never on push / pull_request.
# This workflow runs every assurance gate against a specified git ref,
# collects verdicts regardless of individual gate failures, and emits a
# signed-off RST record that can be attached to a milestone review.
#
# Reuse: copy this workflow and scripts/gen_recertification_record.py +
# scripts/recertify_local.sh to any project.  Update the gate jobs and the
# --gate-label arguments in the `record` job to match the target project.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to certify (branch, tag, or full SHA)'
        required: true
        default: 'main'
      milestone:
        description: 'Lifecycle milestone'
        type: choice
        options: [SRR, PDR, CDR, SAR, Flight, Hotfix, Periodic]
        default: Periodic
      reason:
        description: 'Reason for this certification run'
        required: true
        default: 'Periodic recertification'
      authority:
        description: 'Authorising party (name / role)'
        required: false
        default: ''

# ---------------------------------------------------------------------------
# All gate jobs are independent (no `needs:` between them) so they run in
# parallel and all complete even if some fail.  The final `record` job
# reads every gate's outcome via `needs.<job>.result` with `if: always()`.
# ---------------------------------------------------------------------------

# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

# Serialised per ref, never cancelled: each run is dispatched deliberately
# and emits a signed-off record, so a second certification of the same ref
# queues behind the first rather than killing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # --------------------------------------------------------------------------
  # Gate 1 — Lint / Static Analysis  [SWE-108, SWE-117]
  # --------------------------------------------------------------------------
  gate-lint:
    name: "Gate: Lint / Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install cppcheck + ninja
        run: sudo apt-get install -y cppcheck ninja-build
      - name: Lint checks (pyright, cppcheck, ruff)
        run: task lint-check
      - name: Build flags gate (S10 / SWE-109)
        run: |
          cmake -B build/flags -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/flags --parallel
          uv run python scripts/check_build_flags.py build/flags/compile_commands.json

  # --------------------------------------------------------------------------
  # Gate 2 — C++ Unit Tests  [SWE-127]
  # --------------------------------------------------------------------------
  gate-test-cpp:
    name: "Gate: C++ Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test-cpp

  # --------------------------------------------------------------------------
  # Gate 3 — SWIFI Fault Injection  [SW-SAF-06]
  # --------------------------------------------------------------------------
  gate-swifi:
    name: "Gate: SWIFI Fault Injection"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task swifi

  # --------------------------------------------------------------------------
  # Gate 4 — Sanitizers (ASan + UBSan)  [SWE-128]
  # --------------------------------------------------------------------------
  gate-sanitize:
    name: "Gate: Sanitizers (ASan + UBSan)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task sanitize

  # --------------------------------------------------------------------------
  # Gate 5 — C++ Structural Coverage (region / line / MC/DC)  [SWE-127]
  # --------------------------------------------------------------------------
  # This was two jobs: "C++ Line Coverage" running `task coverage-cpp`, and
  # "MC/DC Coverage" rebuilding the same instrumented tree by hand. But
  # `task coverage-cpp` IS the MC/DC task (-DENABLE_LLVM_COVERAGE=ON,
  # -show-mcdc-summary), so the record presented one measurement twice as two
  # independent SWE-127 gates. Neither enforced anything: both ran the
  # measurement and discarded the verdict, passing at any coverage number.
  gate-coverage:
    name: "Gate: C++ Structural Coverage (region/line/MC/DC)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLVM_VERSION: "19"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install LLVM ${{ env.LLVM_VERSION }} + ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} lld-${LLVM_VERSION}
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Measure coverage
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          task coverage-cpp
      - name: Enforce the coverage floors
        # The floors are defined once, in the THRESHOLDS table of
        # scripts/coverage_evidence_report.py, which exits non-zero when a
        # metric falls below its own. The gate this replaces ran the
        # measurement and never looked at the result.
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          python3 scripts/coverage_evidence_report.py \
            --build-dir build/coverage \
            --output-rst build/coverage/coverage_evidence.rst \
            --output-json build/coverage/coverage_summary.json
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recertify-coverage-evidence
          path: |
            build/coverage/coverage_evidence.rst
            build/coverage/coverage_summary.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # Gate 6 — clang-tidy Analysis  [SWE-108]
  # --------------------------------------------------------------------------
  gate-tidy:
    name: "Gate: clang-tidy Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install clang + clang-tidy + ninja
        run: sudo apt-get install -y ninja-build clang clang-tidy
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Run clang-tidy
        run: CC=clang CXX=clang++ task tidy

  # --------------------------------------------------------------------------
  # Gate 7 — WCET Benchmark Profile  [Safety Plan §4]
  # --------------------------------------------------------------------------
  gate-wcet:
    name: "Gate: WCET Benchmark Profile"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (Release)
        run: |
          cmake -B build/wcet -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/wcet --parallel
      # Reporters write to files, so a Catch2 budget failure would
      # otherwise surface as a bare "exit code 1" with no indication of which
      # budget was missed — the same lesson wcet.yml records.
      - name: Run benchmarks
        # `[wcet]` is the tag these benchmarks actually carry. This read
        # `[performance]` — a Taskfile target name, not a Catch2 tag — which
        # matched nothing; Catch2 3.4.0 exits 0 on an empty filter, so the
        # gate recorded PASS over zero measurements.
        run: |
          build/wcet/test_lunalink "[wcet]" \
            --reporter "console::out=/tmp/wcet_console.txt" \
            --reporter "xml::out=/tmp/wcet_results.xml"
      - name: Show benchmark output
        if: always()
        run: |
          grep -B4 -A12 -E "FAILED|with expansion" /tmp/wcet_console.txt || true
          echo "--- tail ---"
          tail -30 /tmp/wcet_console.txt || true
      # The hand-rolled parser this replaces read the "estimated total run
      # time" column and folded the samples/iterations counts into the
      # benchmark name, so it recovered 2 of 7 benchmarks, each exactly once,
      # and then skipped every tolerance check for want of a second sample.
      # performance_report.py reads the XML reporter's mean/low/high/stddev
      # and gates on 95% CI spread, defaulting to --stability fail. It is the
      # same check wcet.yml runs.
      - name: Check WCET measurement quality (95% CI spread)
        run: |
          python3 scripts/performance_report.py \
            --xml /tmp/wcet_results.xml \
            --console /tmp/wcet_console.txt \
            --output /tmp/wcet_profile.rst
      - name: Upload WCET profile
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recertify-wcet-profile
          path: |
            /tmp/wcet_profile.rst
            /tmp/wcet_console.txt
            /tmp/wcet_results.xml
          retention-days: 90

  # Gate 8 — Python Tests  [SWE-128]
  # --------------------------------------------------------------------------
  gate-test-python:
    name: "Gate: Python Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task test-py

  # --------------------------------------------------------------------------
  # Gate 9 — Documentation Build  [SWE-104]
  # --------------------------------------------------------------------------
  gate-docs:
    name: "Gate: Documentation Build"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install doxygen and pandoc
        run: sudo apt-get install -y doxygen pandoc
      - run: task docs-build

  # --------------------------------------------------------------------------
  # Record job — runs ALWAYS, collects all gate outcomes, emits RST record
  # --------------------------------------------------------------------------
  record:
    name: Generate Recertification Record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    needs:
      - gate-lint
      - gate-test-cpp
      - gate-swifi
      - gate-sanitize
      - gate-coverage
      - gate-tidy
      - gate-wcet
      - gate-test-python
      - gate-docs

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve ref metadata
        id: meta
        run: |
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Prefer tag name when on exact tag, then branch, then "detached"
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ -n "${TAG}" ]]; then
            echo "ref_name=${TAG}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'detached')"
            echo "ref_name=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Map gate outcomes and generate record
        env:
          RESULT_LINT:         ${{ needs.gate-lint.result }}
          RESULT_TEST_CPP:     ${{ needs.gate-test-cpp.result }}
          RESULT_SWIFI:        ${{ needs.gate-swifi.result }}
          RESULT_SANITIZE:     ${{ needs.gate-sanitize.result }}
          RESULT_COVERAGE:     ${{ needs.gate-coverage.result }}
          RESULT_TIDY:         ${{ needs.gate-tidy.result }}
          RESULT_WCET:         ${{ needs.gate-wcet.result }}
          RESULT_TEST_PYTHON:  ${{ needs.gate-test-python.result }}
          RESULT_DOCS:         ${{ needs.gate-docs.result }}
        run: |
          map_result() {
            case "$1" in
              success)   echo "PASS"      ;;
              failure)   echo "FAIL"      ;;
              cancelled) echo "CANCELLED" ;;
              skipped)   echo "SKIPPED"   ;;
              *)         echo "SKIPPED"   ;;
            esac
          }

          python3 scripts/gen_recertification_record.py \
            --project   "LunaLink" \
            --doc-id    "LUNALINK-RCERT-001" \
            --ref       "${{ steps.meta.outputs.full }}" \
            --ref-name  "${{ steps.meta.outputs.ref_name }}" \
            --milestone "${{ github.event.inputs.milestone || 'Periodic' }}" \
            --reason    "${{ github.event.inputs.reason || 'Weekly scheduled recertification' }}" \
            --authority "${{ github.event.inputs.authority || 'GitHub Actions (scheduled)' }}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --gate "lint=$(map_result "${RESULT_LINT}")" \
            --gate "test-cpp=$(map_result "${RESULT_TEST_CPP}")" \
            --gate "swifi=$(map_result "${RESULT_SWIFI}")" \
            --gate "sanitize=$(map_result "${RESULT_SANITIZE}")" \
            --gate "coverage=$(map_result "${RESULT_COVERAGE}")" \
            --gate "tidy=$(map_result "${RESULT_TIDY}")" \
            --gate "wcet=$(map_result "${RESULT_WCET}")" \
            --gate "test-python=$(map_result "${RESULT_TEST_PYTHON}")" \
            --gate "docs=$(map_result "${RESULT_DOCS}")" \
            --gate-label "lint=Lint / Static Analysis (SWE-108, SWE-117)" \
            --gate-label "test-cpp=C++ Unit Tests (SWE-127)" \
            --gate-label "swifi=SWIFI Fault Injection (SW-SAF-06)" \
            --gate-label "sanitize=Sanitizers ASan+UBSan (SWE-128)" \
            --gate-label "coverage=C++ Structural Coverage region/line/MC-DC (SWE-127)" \
            --gate-label "tidy=clang-tidy Analysis (SWE-108)" \
            --gate-label "wcet=WCET Benchmark Profile (Safety Plan §4)" \
            --gate-label "test-python=Python Tests (SWE-128)" \
            --gate-label "docs=Documentation Build (SWE-104)" \
            --out docs/assurance/recertification_record.rst

          echo ""
          echo "=== Recertification Record ==="
          cat docs/assurance/recertification_record.rst

      - name: Upload recertification record
        uses: actions/upload-artifact@v5
        with:
          name: >-
            recertification-record-${{ github.event.inputs.milestone || 'Periodic' }}-${{ steps.meta.outputs.short }}
          path: docs/assurance/recertification_record.rst
          if-no-files-found: error
