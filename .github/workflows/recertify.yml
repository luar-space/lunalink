name: Recertification

# ---------------------------------------------------------------------------
# Triggered ONLY on explicit demand — never on push / pull_request.
# This workflow runs every assurance gate against a specified git ref,
# collects verdicts regardless of individual gate failures, and emits a
# signed-off RST record that can be attached to a milestone review.
#
# Reuse: copy this workflow and scripts/gen_recertification_record.py +
# scripts/recertify_local.sh to any project.  Update the gate jobs and the
# --gate-label arguments in the `record` job to match the target project.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to certify (branch, tag, or full SHA)'
        required: true
        default: 'main'
      milestone:
        description: 'Lifecycle milestone'
        type: choice
        options: [SRR, PDR, CDR, SAR, Flight, Hotfix, Periodic]
        default: Periodic
      reason:
        description: 'Reason for this certification run'
        required: true
        default: 'Periodic recertification'
      authority:
        description: 'Authorising party (name / role)'
        required: false
        default: ''

# ---------------------------------------------------------------------------
# All gate jobs are independent (no `needs:` between them) so they run in
# parallel and all complete even if some fail.  The final `record` job
# reads every gate's outcome via `needs.<job>.result` with `if: always()`.
# ---------------------------------------------------------------------------

jobs:

  # --------------------------------------------------------------------------
  # Gate 1 — Lint / Static Analysis  [SWE-108, SWE-117]
  # --------------------------------------------------------------------------
  gate-lint:
    name: "Gate: Lint / Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install cppcheck + ninja
        run: sudo apt-get install -y cppcheck ninja-build
      - name: Lint checks (pyright, cppcheck, ruff)
        run: task lint-check
      - name: Build flags gate (S10 / SWE-109)
        run: |
          cmake -B build/flags -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/flags --parallel
          uv run python scripts/check_build_flags.py build/flags/compile_commands.json

  # --------------------------------------------------------------------------
  # Gate 2 — C++ Unit Tests  [SWE-127]
  # --------------------------------------------------------------------------
  gate-test-cpp:
    name: "Gate: C++ Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - run: task test-cpp

  # --------------------------------------------------------------------------
  # Gate 3 — SWIFI Fault Injection  [SW-SAF-06]
  # --------------------------------------------------------------------------
  gate-swifi:
    name: "Gate: SWIFI Fault Injection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task swifi

  # --------------------------------------------------------------------------
  # Gate 4 — Sanitizers (ASan + UBSan)  [SWE-128]
  # --------------------------------------------------------------------------
  gate-sanitize:
    name: "Gate: Sanitizers (ASan + UBSan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - run: task sanitize

  # --------------------------------------------------------------------------
  # Gate 5 — C++ Line Coverage  [SWE-127]
  # --------------------------------------------------------------------------
  gate-coverage-cpp:
    name: "Gate: C++ Line Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task coverage-cpp

  # --------------------------------------------------------------------------
  # Gate 6 — MC/DC Coverage  [SWE-127]
  # --------------------------------------------------------------------------
  gate-coverage-mcdc:
    name: "Gate: MC/DC Coverage"
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "19"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install LLVM ${{ env.LLVM_VERSION }} + ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} lld-${LLVM_VERSION}
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (LLVM MC/DC)
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          cmake -B build/mcdc -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_LLVM_COVERAGE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          cmake --build build/mcdc --parallel
      - name: Run tests
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          LLVM_PROFILE_FILE="lunalink-%m.profraw" \
            ctest --test-dir build/mcdc --output-on-failure
      - name: Merge profiles and generate MC/DC report
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          llvm-profdata merge -sparse build/mcdc/*.profraw \
            -o build/mcdc/lunalink.profdata
          llvm-cov report build/mcdc/test_lunalink \
            -instr-profile=build/mcdc/lunalink.profdata \
            -show-mcdc-summary \
            -ignore-filename-regex='_deps|tests' \
            -path-equivalence=.,$(pwd)

  # --------------------------------------------------------------------------
  # Gate 7 — clang-tidy Analysis  [SWE-108]
  # --------------------------------------------------------------------------
  gate-tidy:
    name: "Gate: clang-tidy Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install clang + clang-tidy + ninja
        run: sudo apt-get install -y ninja-build clang clang-tidy
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Run clang-tidy
        run: CC=clang CXX=clang++ task tidy

  # --------------------------------------------------------------------------
  # Gate 8 — WCET Benchmark Profile  [Safety Plan §4]
  # --------------------------------------------------------------------------
  gate-wcet:
    name: "Gate: WCET Benchmark Profile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Install ninja
        run: sudo apt-get install -y ninja-build
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Configure (Release)
        run: |
          cmake -B build/wcet -S . -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/wcet --parallel
      - name: Run benchmarks
        run: |
          build/wcet/test_lunalink "[performance]" --reporter console \
            2>&1 | tee /tmp/wcet_raw.txt
      - name: Check WCET tolerance (±2% intra-run input-class spread)
        run: |
          python3 - <<'PYEOF'
          import re, sys

          with open('/tmp/wcet_raw.txt') as f:
              raw = f.read()

          timing_pattern = re.compile(
              r'^\s*([\w_]+(?:\s+[\w_]+)*?)\s+(\d+(?:\.\d+)?)\s+(ns|us|ms)\s', re.MULTILINE)
          timings: dict[str, list[float]] = {}
          for m in timing_pattern.finditer(raw):
              name = m.group(1).strip()
              val  = float(m.group(2))
              unit = m.group(3)
              if unit == 'us':
                  val *= 1_000
              elif unit == 'ms':
                  val *= 1_000_000
              timings.setdefault(name, []).append(val)

          ci_failed = False
          for fn, vals in sorted(timings.items()):
              if len(vals) < 2:
                  print(f'WARN  {fn}: only one timing sample; tolerance check skipped')
              else:
                  lo, hi = min(vals), max(vals)
                  pct = (hi - lo) / lo * 100.0 if lo > 0 else 0.0
                  if pct > 2.0:
                      print(f'FAIL  {fn}: deviation {pct:.1f}% exceeds ±2% limit')
                      ci_failed = True
                  else:
                      print(f'PASS  {fn}: deviation {pct:.1f}% within ±2%')

          if not timings:
              print('(no [performance] benchmarks found)')
          if ci_failed:
              print('ERROR: one or more functions exceeded ±2% WCET tolerance.', file=sys.stderr)
              sys.exit(1)
          PYEOF

  # --------------------------------------------------------------------------
  # Gate 9 — Python Tests  [SWE-128]
  # --------------------------------------------------------------------------
  gate-test-python:
    name: "Gate: Python Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task test-py

  # --------------------------------------------------------------------------
  # Gate 10 — Documentation Build  [SWE-104]
  # --------------------------------------------------------------------------
  gate-docs:
    name: "Gate: Documentation Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - uses: arduino/setup-task@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: task docs-build

  # --------------------------------------------------------------------------
  # Record job — runs ALWAYS, collects all gate outcomes, emits RST record
  # --------------------------------------------------------------------------
  record:
    name: Generate Recertification Record
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gate-lint
      - gate-test-cpp
      - gate-swifi
      - gate-sanitize
      - gate-coverage-cpp
      - gate-coverage-mcdc
      - gate-tidy
      - gate-wcet
      - gate-test-python
      - gate-docs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Resolve ref metadata
        id: meta
        run: |
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Prefer tag name when on exact tag, then branch, then "detached"
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ -n "${TAG}" ]]; then
            echo "ref_name=${TAG}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'detached')"
            echo "ref_name=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Map gate outcomes and generate record
        env:
          RESULT_LINT:         ${{ needs.gate-lint.result }}
          RESULT_TEST_CPP:     ${{ needs.gate-test-cpp.result }}
          RESULT_SWIFI:        ${{ needs.gate-swifi.result }}
          RESULT_SANITIZE:     ${{ needs.gate-sanitize.result }}
          RESULT_COVERAGE_CPP: ${{ needs.gate-coverage-cpp.result }}
          RESULT_COVERAGE_MCDC: ${{ needs.gate-coverage-mcdc.result }}
          RESULT_TIDY:         ${{ needs.gate-tidy.result }}
          RESULT_WCET:         ${{ needs.gate-wcet.result }}
          RESULT_TEST_PYTHON:  ${{ needs.gate-test-python.result }}
          RESULT_DOCS:         ${{ needs.gate-docs.result }}
        run: |
          map_result() {
            case "$1" in
              success)   echo "PASS"      ;;
              failure)   echo "FAIL"      ;;
              cancelled) echo "CANCELLED" ;;
              skipped)   echo "SKIPPED"   ;;
              *)         echo "SKIPPED"   ;;
            esac
          }

          python3 scripts/gen_recertification_record.py \
            --project   "LunaLink" \
            --doc-id    "LUNALINK-RCERT-001" \
            --ref       "${{ steps.meta.outputs.full }}" \
            --ref-name  "${{ steps.meta.outputs.ref_name }}" \
            --milestone "${{ github.event.inputs.milestone }}" \
            --reason    "${{ github.event.inputs.reason }}" \
            --authority "${{ github.event.inputs.authority }}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --gate "lint=$(map_result "${RESULT_LINT}")" \
            --gate "test-cpp=$(map_result "${RESULT_TEST_CPP}")" \
            --gate "swifi=$(map_result "${RESULT_SWIFI}")" \
            --gate "sanitize=$(map_result "${RESULT_SANITIZE}")" \
            --gate "coverage-cpp=$(map_result "${RESULT_COVERAGE_CPP}")" \
            --gate "coverage-mcdc=$(map_result "${RESULT_COVERAGE_MCDC}")" \
            --gate "tidy=$(map_result "${RESULT_TIDY}")" \
            --gate "wcet=$(map_result "${RESULT_WCET}")" \
            --gate "test-python=$(map_result "${RESULT_TEST_PYTHON}")" \
            --gate "docs=$(map_result "${RESULT_DOCS}")" \
            --gate-label "lint=Lint / Static Analysis (SWE-108, SWE-117)" \
            --gate-label "test-cpp=C++ Unit Tests (SWE-127)" \
            --gate-label "swifi=SWIFI Fault Injection (SW-SAF-06)" \
            --gate-label "sanitize=Sanitizers ASan+UBSan (SWE-128)" \
            --gate-label "coverage-cpp=C++ Line Coverage (SWE-127)" \
            --gate-label "coverage-mcdc=MC/DC Coverage (SWE-127)" \
            --gate-label "tidy=clang-tidy Analysis (SWE-108)" \
            --gate-label "wcet=WCET Benchmark Profile (Safety Plan §4)" \
            --gate-label "test-python=Python Tests (SWE-128)" \
            --gate-label "docs=Documentation Build (SWE-104)" \
            --out docs/assurance/recertification_record.rst

          echo ""
          echo "=== Recertification Record ==="
          cat docs/assurance/recertification_record.rst

      - name: Upload recertification record
        uses: actions/upload-artifact@v4
        with:
          name: >-
            recertification-record-${{ github.event.inputs.milestone }}-${{ steps.meta.outputs.short }}
          path: docs/assurance/recertification_record.rst
          if-no-files-found: error
