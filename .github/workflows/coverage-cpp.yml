name: C++ Coverage (MC/DC)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.rst'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  coverage-mcdc:
    name: LLVM MC/DC Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLVM_VERSION: "19"
      # Exposed so the badge steps can skip themselves where no gist is
      # configured (a fork, or this submission repository) instead of failing.
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Not cached. /usr/lib/llvm-19 is root-owned and actions/cache extracts
      # unprivileged, so the restore could never work: every run reported
      # "Cache hit", downloaded 108 MB, failed with hundreds of
      # "tar: /usr/lib/llvm-19: Cannot mkdir: Permission denied", reported
      # "Cache not found for input keys" and apt-installed LLVM regardless.
      # The download was the entire cost and the install happened anyway.
      # Making it work would mean staging the tree somewhere writable and
      # restoring it with sudo, for an apt install that takes well under a
      # minute -- not worth the machinery.
      - name: Install LLVM ${{ env.LLVM_VERSION }} + tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} lld-${LLVM_VERSION}
      - name: Install Ninja
        # No apt-get update: the LLVM step above added the apt.llvm.org
        # source and refreshed the index already, in this same job.
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: coverage-mcdc
      - uses: arduino/setup-task@v3
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Run MC/DC coverage
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          task coverage-cpp
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      # mission_assurance.rst states that the floors "are defined once, in the
      # THRESHOLDS table of scripts/coverage_evidence_report.py, and consumed
      # from there by .github/workflows/coverage-cpp.yml". They were not: this
      # workflow restated three of the six in its own env block and enforced
      # those with awk, ignoring the function, branch and per-file floors.
      # The script owns the table and exits non-zero on a FAIL verdict, so the
      # claim is now true and all six floors are gated.
      - name: Generate coverage evidence and enforce the floors
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          python3 scripts/coverage_evidence_report.py \
            --build-dir build/coverage \
            --output-rst build/coverage/coverage_evidence.rst \
            --output-json build/coverage/coverage_summary.json

      - name: Extract coverage metrics
        id: coverage
        run: |
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
          mkdir -p build/coverage

          # Human-readable report, kept as an artifact. Measured on
          # test_lunalink alone, matching coverage_evidence_report.py: the
          # SWIFI binary is fault-detection evidence, not coverage (see its
          # module docstring). Folding it in moved every metric -- regions
          # 93.65 -> 93.49, lines 90.27 -> 89.94, MC/DC 40.59 -> 38.25 -- so
          # the gate and the evidence report were scoring different things.
          llvm-cov report build/coverage/test_lunalink \
            -instr-profile=build/coverage/lunalink.profdata \
            -show-mcdc-summary \
            -ignore-filename-regex='_deps|tests' \
            | tee build/coverage/mcdc_report.txt

          # Percentages come from the evidence JSON. This used to splice a
          # positional array out of `grep -oE '[0-9]+\.[0-9]+%'` over the
          # TOTAL line, which silently depends on column order and on every
          # field carrying a decimal point.
          python3 - <<'EOF'
          import json, os

          totals = json.load(open('build/coverage/coverage_summary.json'))['totals']

          def colour(pct):
              if pct >= 100: return 'brightgreen'
              if pct >= 80:  return 'yellow'
              if pct >= 50:  return 'orange'
              return 'red'

          rows = {}
          for key, name in (('regions', 'region'), ('functions', 'function'),
                            ('lines', 'line'), ('branches', 'branch'),
                            ('mcdc', 'mcdc')):
              pct = totals[key]['percent']
              rows[f'{name}_pct'] = f'{pct:.2f}%'
              rows[f'{name}_color'] = colour(pct)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              for k, v in rows.items():
                  fh.write(f'{k}={v}\n')

          with open('build/coverage/coverage-badge.json', 'w') as fh:
              json.dump({'schemaVersion': 1, 'label': 'MC/DC',
                         'message': rows['mcdc_pct'],
                         'color': rows['mcdc_color']}, fh)

          print(f"::notice::MC/DC {rows['mcdc_pct']} | Lines {rows['line_pct']} "
                f"| Branches {rows['branch_pct']} | Regions {rows['region_pct']}")
          EOF

      - name: Write job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## MC/DC Coverage

          | Metric | Coverage |
          |--------|----------|
          | Lines | ${{ steps.coverage.outputs.line_pct }} |
          | Regions | ${{ steps.coverage.outputs.region_pct }} |
          | Functions | ${{ steps.coverage.outputs.function_pct }} |
          | Branches | ${{ steps.coverage.outputs.branch_pct }} |
          | MC/DC | ${{ steps.coverage.outputs.mcdc_pct }} |

          Full annotated HTML report is in the **mcdc-coverage** artifact for this run.
          EOF

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcdc-coverage
          path: |
            build/coverage/mcdc_report.txt
            build/coverage/coverage-badge.json
            build/coverage/coverage_evidence.rst
            build/coverage/coverage_summary.json
            build/coverage/html/

      - name: Update region coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: lunalink-region-coverage.json
          label: Regions
          message: ${{ steps.coverage.outputs.region_pct }}
          color: ${{ steps.coverage.outputs.region_color }}

      - name: Update line coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: lunalink-line-coverage.json
          label: Lines
          message: ${{ steps.coverage.outputs.line_pct }}
          color: ${{ steps.coverage.outputs.line_color }}

      - name: Update branch coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: lunalink-branch-coverage.json
          label: Branches
          message: ${{ steps.coverage.outputs.branch_pct }}
          color: ${{ steps.coverage.outputs.branch_color }}

      - name: Update MC/DC coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: lunalink-mcdc-coverage.json
          label: MC/DC
          message: ${{ steps.coverage.outputs.mcdc_pct }}
          color: ${{ steps.coverage.outputs.mcdc_color }}
