name: Python Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'


# Least privilege: every token use in this workflow is a read
# (arduino/setup-task fetching Task from GitHub releases).
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: single fast job. Main: full matrix.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.13"]') || fromJSON('["3.12", "3.13", "3.14"]') }}
        os: [ubuntu-latest]
        # Folded scalar: the inline JSON contains colons, which YAML cannot
        # parse in a plain scalar — the workflow failed to load without it.
        include: >-
          ${{ github.event_name != 'pull_request' && fromJSON('[{"python-version": "3.12", "os": "windows-latest"}, {"python-version": "3.12", "os": "macos-14"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        if: runner.os != 'Windows'
        with:
          key: python-${{ matrix.python-version }}-${{ matrix.os }}
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group test
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}

      # G-15: build the third-party interop oracles so tests/test_interop_*.py
      # actually run instead of silently skipping. Linux-only; macOS/Windows
      # cross-compile of LANS-AFS-SIM / PocketSDR is out of scope.
      - name: Build LANS-AFS-SIM (AFS interop oracle)
        if: runner.os == 'Linux'
        run: uv run python scripts/interop/build_lans_afs_sim.py

      # A PocketSDR oracle step used to live here. It built non-AFS code
      # generators (GPS/Galileo) for the multi-constellation work that is not
      # part of this repository, and referenced a script this repository does
      # not contain. The AFS interop oracle above is the one the tests need;
      # scripts/check_interop_tests.py requires only the LANS-AFS-SIM binaries.

      - name: Verify interop tests are not silently skipped (G-15 gate)
        if: runner.os == 'Linux'
        run: uv run python scripts/check_interop_tests.py

      - run: task test-py

      - name: Generate coverage JSON
        if: matrix.python-version == '3.12'
        run: uv run python -m coverage json -o coverage.json

      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: python-coverage
          path: coverage.json

  coverage-badge:
    name: Update Python Coverage Badge
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Skip the badge where no gist is configured (a fork, or the submission
      # repository) instead of failing the workflow over a cosmetic artefact.
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
    steps:
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: python-coverage

      - name: Extract percentage
        id: coverage
        run: |
          PCT=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
          echo "pct=${PCT}%" >> "$GITHUB_OUTPUT"

          # Determine badge color: <50 red, 50-79 orange, 80-99 yellow, 100 brightgreen
          COLOR="red"
          if awk "BEGIN{exit !(${PCT} >= 50)}"; then COLOR="orange"; fi
          if awk "BEGIN{exit !(${PCT} >= 80)}"; then COLOR="yellow"; fi
          if awk "BEGIN{exit !(${PCT} >= 100)}"; then COLOR="brightgreen"; fi
          echo "color=${COLOR}" >> "$GITHUB_OUTPUT"

      - name: Update Python coverage badge
        if: env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: lunalink-python-coverage.json
          label: Python Coverage
          message: ${{ steps.coverage.outputs.pct }}
          color: ${{ steps.coverage.outputs.color }}
