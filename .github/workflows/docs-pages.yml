name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Download static-analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-report
          path: docs/assurance/
        continue-on-error: true
      - name: Download cppcheck artifact
        uses: actions/download-artifact@v4
        with:
          name: cppcheck-report
          path: docs/assurance/
        continue-on-error: true
      - name: Download WCET profile artifact
        uses: actions/download-artifact@v4
        with:
          name: wcet-profile
          path: docs/assurance/
        continue-on-error: true
      - run: task docs-build
      - name: Embed coverage HTML report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/coverage-cpp.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            gh run download "$RUN_ID" --name mcdc-coverage --dir /tmp/coverage-artifact/ 2>/dev/null || true
            if [ -d /tmp/coverage-artifact/html ]; then
              mkdir -p docs/_build/html/coverage
              cp -r /tmp/coverage-artifact/html/. docs/_build/html/coverage/
              echo "Coverage HTML embedded at /coverage/"
            fi
          fi
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
