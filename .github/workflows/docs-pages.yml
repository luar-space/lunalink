name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Check whether GitHub Pages is enabled
        # Pages cannot be enabled on a private repository of this plan, and
        # deploy-pages fails with a 404 when it is not. The build still runs
        # as a check on the site; only the deploy is skipped.
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled on this repository; the site was built but not deployed."
          fi
      - uses: arduino/setup-task@v2
        with:
          # Authenticated: the action downloads Task from GitHub releases,
          # and shared runner IPs exhaust the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Install doxygen and pandoc
        # Breathe renders the C++ API from Doxygen XML; task docs-build
        # generates it before Sphinx runs. nbsphinx needs pandoc to render
        # the notebooks' Markdown cells.
        run: sudo apt-get install -y doxygen pandoc
      # These three artifacts are produced by OTHER workflows, so
      # download-artifact cannot reach them: it looks only inside the current
      # run and failed every time with "Artifact not found for name: ...",
      # silenced by continue-on-error. The site has therefore been published
      # without the static-analysis, cppcheck and WCET pages that
      # metrics_plan.rst and sdp.rst cite as deliverables. Resolve each
      # producing workflow's latest successful run on main instead.
      - name: Download assurance artifacts from their producing workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          fetch() {
            wf="$1"; artifact="$2"
            run_id=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${wf}/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "${run_id}" ]; then
              echo "::warning::no successful ${wf} run on main; ${artifact} is missing from the site"
              return
            fi
            if gh run download "${run_id}" --name "${artifact}" --dir docs/assurance/; then
              echo "fetched ${artifact} from ${wf} run ${run_id}"
            else
              echo "::warning::${wf} run ${run_id} carries no ${artifact} (expired?); it is missing from the site"
            fi
          }
          fetch tidy.yml static-analysis-report
          fetch lint.yml cppcheck-report
          fetch wcet.yml wcet-profile
      - run: task docs-build
      - name: Embed coverage HTML report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/coverage-cpp.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            gh run download "$RUN_ID" --name mcdc-coverage --dir /tmp/coverage-artifact/ 2>/dev/null || true
            if [ -d /tmp/coverage-artifact/html ]; then
              mkdir -p docs/_build/html/coverage
              cp -r /tmp/coverage-artifact/html/. docs/_build/html/coverage/
              echo "Coverage HTML embedded at /coverage/"
            fi
          fi
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
