[build-system]
requires = ["scikit-build-core>=1.1.1", "nanobind>=2.0", "setuptools-scm"]
build-backend = "scikit_build_core.build"

[project]
name = "lunalink"
dynamic = ["version"]
description = "Reference implementation of the LunaNet Augmented Forward Signal (LSIS V1.0)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Marco Fiscato", email = "marco.fiscato@gmail.com"}]
maintainers = [{name = "Luar Space", email = "marco.fiscato@gmail.com"}]
keywords = [
    "lunanet",
    "afs",
    "lunar-navigation",
    "gnss",
    "ccsds",
    "sdr",
    "ldpc",
    "bch",
    "flight-software",
    "reference-implementation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Communications :: Ham Radio",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "jaxtyping>=0.2.28", "beartype>=0.18"]

[project.urls]
Homepage = "https://github.com/luar-space/lunalink"
Documentation = "https://luar-space.github.io/lunalink/"
Repository = "https://github.com/luar-space/lunalink"
Issues = "https://github.com/luar-space/lunalink/issues"
Changelog = "https://github.com/luar-space/lunalink/blob/main/CHANGELOG.md"
"Test vectors" = "https://github.com/luar-space/lsis-afs-test-vectors"
"The standard" = "https://www.nasa.gov/directorates/somd/space-communications-navigation-program/lunanet-interoperability-specification/"

[project.scripts]
lunalink = "lunalink.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.24",
    "jaxtyping>=0.2.28",
    "beartype>=0.18",
]
dev = [
    {include-group = "test"},
    # Pinned exactly: clang-format's output changes between major versions, so
    # an unpinned CI (Ubuntu ships 18) disagrees with a developer's Homebrew
    # LLVM about files neither has touched. One binary, one result.
    "clang-format==22.1.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "radon>=6.0",
    "ruff>=0.9",
    "sphinx>=7.0",
    "nbsphinx>=0.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "sphinx-rtd-theme>=2.0",
    "furo>=2024.1.29",
    "sphinx-autobuild>=2024.0.0",
    "pyright>=1.1",
    "gcovr>=7.0",
    "breathe>=4.36.0",
]


[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
# Match only PEP 440 release tags. The competition-era tag "v1.0-submission"
# is not one, and is deliberately excluded rather than parsed around: the
# release it marks is also tagged v1.0.0, which setuptools-scm reads directly.
git_describe_command = ["git", "describe", "--tags", "--long", "--match", "v[0-9]*"]

[tool.scikit-build]
minimum-version = "0.9"
wheel.packages = ["src/lunalink"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
ninja.make-fallback = true
# Persist FetchContent downloads across wheel builds (avoids re-cloning Catch2).
# scikit-build-core expands {env.HOME}; falls back to /tmp on CI where HOME may differ.
cmake.define.FETCHCONTENT_BASE_DIR = {env="FETCHCONTENT_BASE_DIR", default="/tmp/fetchcontent"}

[tool.cibuildwheel]
# These patterns match the GIL-enabled interpreters only: the free-threaded
# builds identify as cp313t / cp314t, which "cp313-*" and "cp314-*" do not
# match, and cibuildwheel additionally requires
# enable = ["cpython-freethreading"] before it will produce them.
#
# That exclusion is deliberate, not an oversight. The C++ core has never been
# analysed for concurrent use: it contains no synchronisation primitives at
# all -- no std::mutex, no std::atomic, no thread_local -- and it does hold
# shared mutable state, such as the function-local vDSP FFT setup singletons
# in cpp/include/lunalink/signal/fft.hpp. Under a removed GIL, nothing stops
# two Python threads entering the extension at once, so a free-threaded wheel
# would ship a concurrency claim this project has not substantiated. Revisit
# when there is a thread-safety analysis to cite; Python 3.14 makes
# free-threading officially supported, so the question will keep being asked.
build = "cp312-* cp313-* cp314-*"

# musl targets are skipped: the wheels link a C++ runtime and no mission
# toolchain in scope uses musl, so building them would create an artifact
# nobody tests against.
skip = "*-musllinux_*"
test-requires = ["pytest", "numpy", "jaxtyping", "beartype"]
test-command = "python -m pytest {project}/tests -x -q --override-ini='addopts='"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lunalink --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["lunalink"]
branch = true
omit = ["src/lunalink/cli.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["docs/conf.py", ".claude/", "build/", ".venv/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]

[tool.ruff.lint.per-file-ignores]
# Notebooks: allow long lines, uppercase math vars, missing docstrings on helpers
"docs/notebooks/*.ipynb" = ["E501", "N806", "D103"]
# Utility scripts: allow complexity, missing docstrings, long lines, ambiguous vars
"scripts/sync_docstrings.py" = ["C901", "D103"]
"scripts/fuzz_seed_corpus.py" = ["D103", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
