[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0", "setuptools-scm"]
build-backend = "scikit_build_core.build"

[project]
name = "lunalink"
dynamic = ["version"]
description = "LunaLink — AFS reference implementation for lunar navigation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Marco Fiscato", email = "marco.fiscato@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "jaxtyping>=0.2.28", "beartype>=0.18"]

[project.scripts]
lunalink = "lunalink.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.24",
    "jaxtyping>=0.2.28",
    "beartype>=0.18",
]
dev = [
    {include-group = "test"},
    "numpy>=1.24",
    "matplotlib>=3.7",
    "radon>=6.0",
    "ruff>=0.9",
    "sphinx>=7.0",
    "nbsphinx>=0.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "sphinx-rtd-theme>=2.0",
    "furo>=2024.1.29",
    "sphinx-autobuild>=2024.0.0",
    "pyright>=1.1",
    "gcovr>=7.0",
]

# [[private-begin]]
[project.optional-dependencies]
private = []
visibility = ["astropy>=6.0", "spiceypy>=6.0"]
# [[private-end]]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
git_describe_command = ["git", "describe", "--tags", "--long", "--match", "v*"]

[tool.scikit-build]
minimum-version = "0.9"
wheel.packages = ["src/lunalink"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
ninja.make-fallback = true
# Persist FetchContent downloads across wheel builds (avoids re-cloning Catch2).
# scikit-build-core expands {env.HOME}; falls back to /tmp on CI where HOME may differ.
cmake.define.FETCHCONTENT_BASE_DIR = {env="FETCHCONTENT_BASE_DIR", default="/tmp/fetchcontent"}

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "numpy", "jaxtyping", "beartype"]
test-command = "python -m pytest {project}/tests -x -q --override-ini='addopts='"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lunalink --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["lunalink"]
branch = true
omit = ["src/lunalink/cli.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["docs/conf.py", ".claude/", "build/", ".venv/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]

[tool.ruff.lint.per-file-ignores]
# Notebooks: allow long lines, uppercase math vars, missing docstrings on helpers
"docs/notebooks/*.ipynb" = ["E501", "N806", "D103"]
# Utility scripts: allow complexity, missing docstrings, long lines, ambiguous vars
"scripts/sync_docstrings.py" = ["C901", "D103"]
# moon-gnss-ssv scripts (from PR #83): uppercase math vars (IAU/GNSS
# notation), script-level complexity, sys.path bootstrap after imports,
# loose docstrings — matches notebook/script style, not library style.
"moon-gnss-ssv/src/*.py" = [
    "E402", "E501", "N806", "C901",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D205", "D400", "D401", "D415",
]
"moon-gnss-ssv/scripts/*.py" = ["E501"]
# Diagnostic / research scripts (one-off investigation artefacts for
# S1-2/S1-3/S1-4 + the moon-gnss-ssv calibration): uppercase math vars
# (IAU/GNSS notation), long lines, loose docstrings, complexity, f-strings-
# without-placeholders — research-script style, not flight-quality code.
# Superset of PR #83's relaxations plus C901 from S1-4e (needed for the
# S1-3h diagnostic helpers).
"scripts/diagnostics/*.py" = [
    "C901", "E501", "F541",
    "N803", "N806", "N815",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D205", "D400", "D401", "D415",
]
# Campaign driver + code-generator utilities: allow missing docstrings on
# private helpers and the long inline ICD/ablation comments.
"scripts/lugre_campaign.py" = ["D103", "E501"]
"scripts/generate_galileo_e5a.py" = ["D103", "E501"]
"scripts/fuzz_seed_corpus.py" = ["D103", "E501"]
# Investigation-grade test modules — H0-dump env-var guard and the joint
# C/N0 convention smoke: inherit the diagnostics relaxation.
"tests/test_h0_dump_hook_guard.py" = [
    "D101", "D102", "D103", "D205", "E501", "N806",
]
"tests/test_joint_cn0_convention.py" = [
    "D101", "D102", "D103", "D205", "E501", "N806",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
