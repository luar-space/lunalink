version: '3'

set: [pipefail]
shopt: [globstar]

tasks:
  install:
    desc: Install or update project dependencies.
    cmd: uv sync --group dev

  build:
    desc: Force recompile the C++ extension.
    cmd: uv sync --group dev --reinstall-package lunalink

  install-hooks:
    desc: Install git hooks for pre-commit checks.
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed. Pre-commit checks will run automatically."

  test:
    desc: Rebuild C++ extension, then run C++ and Python tests.
    cmds:
      - task: build
      - task: test-cpp
      - task: test-py
    silent: false

  test-py:
    desc: Run Python tests.
    cmd: uv run python -m pytest

  wcet:
    desc: Run [wcet]-tagged timing benchmarks (Release), generate wcet_profile.rst + bench.json.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR: build/performance
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BUILD_DIR}} --parallel
      - |
        {{.BUILD_DIR}}/test_lunalink "[wcet]" \
          --reporter "console::out={{.BUILD_DIR}}/wcet_console.txt" \
          --reporter "xml::out={{.BUILD_DIR}}/wcet_results.xml"
      - |
        python3 scripts/performance_report.py \
          --xml {{.BUILD_DIR}}/wcet_results.xml \
          --console {{.BUILD_DIR}}/wcet_console.txt \
          --output {{.BUILD_DIR}}/wcet_profile.rst \
          --bench-json {{.BUILD_DIR}}/bench.json
      - 'echo "WCET profile: {{.BUILD_DIR}}/wcet_profile.rst"'
    silent: false

  ber:
    desc: Run [channel]-tagged simulations (BER/FER sweeps, Pd, Release). Fails on any assertion.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR: build/performance
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/test_lunalink [channel] --reporter console"
    silent: false

  integration:
    desc: Run [e2e]-tagged integration tests (full TX→RX stack, Debug build).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/test_lunalink [e2e] --reporter console"
    silent: false

  performance:
    desc: Run all performance tests — [wcet] timing report + [ber] channel simulations.
    cmds:
      - task: wcet
      - task: ber
    silent: false

  test-cpp:
    desc: "Fast CI gate: unit + integration tests (excludes slow acceptance tests)."
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
      NCPU:
        sh: sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 4
      RNG_SEED: '{{.RNG_SEED | default "0"}}'
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - mkdir -p {{.BUILD_DIR}}/test-results
      - |
        {{.BUILD_DIR}}/test_lunalink "~[ber]~[fer]~[channel]~[wcet]~[e2e]" \
          --abort --rng-seed {{.RNG_SEED}} \
          --reporter console \
          --reporter "junit::out={{.BUILD_DIR}}/test-results/lunalink.xml"
      - |
        SHARDS={{.NCPU}}
        PIDS=()
        for i in $(seq 0 $((SHARDS - 1))); do
          {{.BUILD_DIR}}/test_receiver "~[slow]~[deep]~[pfa]~[swifi]" \
            --shard-count "$SHARDS" --shard-index "$i" --abort \
            --rng-seed {{.RNG_SEED}} \
            --reporter console \
            --reporter "junit::out={{.BUILD_DIR}}/test-results/receiver_shard_${i}.xml" &
          PIDS+=($!)
        done
        RESULT=0
        for pid in "${PIDS[@]}"; do
          wait "$pid" || RESULT=1
        done
        exit $RESULT
    silent: false

  test-acceptance:
    desc: "Slow acceptance tests: Monte Carlo Pd, BER, channel, E2E, WCET. Nightly / pre-release."
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
      RNG_SEED: '{{.RNG_SEED | default "0"}}'
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - mkdir -p {{.BUILD_DIR}}/test-results
      - |
        {{.BUILD_DIR}}/test_lunalink \
          --abort --rng-seed {{.RNG_SEED}} \
          --reporter console \
          --reporter "junit::out={{.BUILD_DIR}}/test-results/lunalink_acceptance.xml"
      - |
        {{.BUILD_DIR}}/test_receiver \
          --abort --rng-seed {{.RNG_SEED}} \
          --reporter console \
          --reporter "junit::out={{.BUILD_DIR}}/test-results/receiver_acceptance.xml"
    silent: false

  ldpc-algo-card:
    desc: Generate LDPC algorithm performance card (parallel simulations + plots).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
    cmds:
      - cmake -B build/algo_card -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build build/algo_card --target ldpc_characterise --parallel
      - mkdir -p docs/_static/algo_card
      - ./build/algo_card/ldpc_characterise > build/algo_card/sp_results.json
      - uv run python scripts/plot_algo_card.py build/algo_card/sp_results.json docs/_static/algo_card/
      - echo "Algorithm card generated. Figures in docs/_static/algo_card/"
    silent: false

  sync-docstrings:
    desc: Check C++ header @param tags and binding docstrings are in sync.
    cmd: uv run python scripts/sync_docstrings.py

  lint:
    desc: Run all static analysis tools (type checking, linting, formatting).
    cmds:
      - task: pyright
      - task: cppcheck
      - task: ruff-fix
      - task: sync-docstrings
    silent: false

  lint-check:
    desc: Run non-mutating lint checks used by CI and pre-commit.
    cmds:
      - task: pyright
      - task: cppcheck
      - task: sync-docstrings
      - uv run ruff format --check .
      - uv run ruff check .
    silent: false

  cppcheck:
    desc: Run cppcheck static analysis on C++ core (ECSS-Q-ST-80C §5.5 evidence).
    cmds:
      - |
        if ! command -v cppcheck >/dev/null 2>&1; then
          echo "ERROR: cppcheck not found. Install it: brew install cppcheck"
          exit 1
        fi
        echo "=== Cppcheck Static Analysis (ECSS-Q-ST-80C §5.5) ==="
        echo "Suppressions: cppcheck.suppressions"
        echo ""
        cppcheck --std=c++20 --platform=unix64 \
          --enable=all \
          --inconclusive \
          --inline-suppr \
          --error-exitcode=1 \
          --suppressions-list=cppcheck.suppressions \
          --template='{file}:{line}: [{severity}] {id}: {message}' \
          --quiet \
          cpp/include/ cpp/codes/ cpp/encoding/ cpp/messages/ cpp/signal/ cpp/platform/ cpp/proprietary/
    silent: false

  pyright:
    desc: Run type checking with pyright.
    cmd: uv run pyright src/

  ruff-fix:
    desc: Run ruff to format and lint with auto-fix.
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix
    silent: false

  coverage-cpp:
    desc: Build and run C++ tests with LLVM-native MC/DC coverage, then generate HTML report.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      LLVM_DIR:
        sh: |
          if command -v llvm-profdata >/dev/null 2>&1; then
            dirname "$(command -v llvm-profdata)"
          elif [ -x /opt/homebrew/opt/llvm/bin/llvm-profdata ]; then
            echo /opt/homebrew/opt/llvm/bin
          elif [ -x /usr/local/opt/llvm/bin/llvm-profdata ]; then
            echo /usr/local/opt/llvm/bin
          fi
    cmds:
      - |
        if [ -z "{{.LLVM_DIR}}" ]; then
          echo "ERROR: LLVM not found. Install it: brew install llvm"
          exit 1
        fi
        echo "Using LLVM from {{.LLVM_DIR}}"
      - cmake -B build/coverage -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_LLVM_COVERAGE=ON -DLUNALINK_FAULT_INJECTION=ON -DCMAKE_CXX_COMPILER={{.LLVM_DIR}}/clang++ --fresh
      - cmake --build build/coverage --parallel
      - rm -f build/coverage/*.profraw build/coverage/*.profdata
      - LLVM_PROFILE_FILE="lunalink-%m.profraw" ctest --test-dir build/coverage --output-on-failure
      - "{{.LLVM_DIR}}/llvm-profdata merge -sparse build/coverage/*.profraw -o build/coverage/lunalink.profdata"
      - |
        {{.LLVM_DIR}}/llvm-cov show build/coverage/test_lunalink \
          -object build/coverage/lunalink_swifi_tests \
          -instr-profile=build/coverage/lunalink.profdata \
          -format=html -output-dir=build/coverage/html \
          -show-mcdc-summary -show-mcdc \
          -ignore-filename-regex='_deps|tests' \
          "-path-equivalence=build/coverage,$(pwd)"
      - "{{.LLVM_DIR}}/llvm-cov report build/coverage/test_lunalink -object build/coverage/lunalink_swifi_tests -instr-profile=build/coverage/lunalink.profdata -show-mcdc-summary -ignore-filename-regex='_deps|tests'"
      - echo "MC/DC Coverage report generated at build/coverage/html/index.html"
      - |
        LINE_PCT=$({{.LLVM_DIR}}/llvm-cov report build/coverage/test_lunalink \
          -object build/coverage/lunalink_swifi_tests \
          -instr-profile=build/coverage/lunalink.profdata \
          -ignore-filename-regex='_deps|tests' 2>/dev/null | \
          awk '/TOTAL/{for(i=1;i<=NF;i++) if($i ~ /%/) {gsub(/%/,"",$i); print $i; exit}}')
        echo "Line coverage: ${LINE_PCT}% (informational — effective coverage is the gate)"
    silent: false

  coverage-oss:
    desc: Coverage for OSS export profile (no SWIFI instrumentation, functional tests only).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      LLVM_DIR:
        sh: |
          if command -v llvm-profdata >/dev/null 2>&1; then
            dirname "$(command -v llvm-profdata)"
          elif [ -x /opt/homebrew/opt/llvm/bin/llvm-profdata ]; then
            echo /opt/homebrew/opt/llvm/bin
          elif [ -x /usr/local/opt/llvm/bin/llvm-profdata ]; then
            echo /usr/local/opt/llvm/bin
          fi
    cmds:
      - |
        if [ -z "{{.LLVM_DIR}}" ]; then
          echo "ERROR: LLVM not found. Install it: brew install llvm"
          exit 1
        fi
        echo "Using LLVM from {{.LLVM_DIR}}"
      - cmake -B build/coverage-oss -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_LLVM_COVERAGE=ON -DLUNALINK_FAULT_INJECTION=OFF -DCMAKE_CXX_COMPILER={{.LLVM_DIR}}/clang++ --fresh
      - cmake --build build/coverage-oss --parallel
      - rm -f build/coverage-oss/*.profraw build/coverage-oss/*.profdata
      - LLVM_PROFILE_FILE="lunalink-%m.profraw" ctest --test-dir build/coverage-oss --output-on-failure
      - "{{.LLVM_DIR}}/llvm-profdata merge -sparse build/coverage-oss/*.profraw -o build/coverage-oss/lunalink.profdata"
      - "{{.LLVM_DIR}}/llvm-cov report build/coverage-oss/test_lunalink -instr-profile=build/coverage-oss/lunalink.profdata -show-mcdc-summary -ignore-filename-regex='_deps|tests'"
      - |
        REGION_PCT=$({{.LLVM_DIR}}/llvm-cov report build/coverage-oss/test_lunalink \
          -instr-profile=build/coverage-oss/lunalink.profdata \
          -ignore-filename-regex='_deps|tests' 2>/dev/null | \
          awk '/TOTAL/{for(i=1;i<=NF;i++) if($i ~ /%/) {gsub(/%/,"",$i); print $i; exit}}')
        echo "OSS region coverage: ${REGION_PCT}% (informational — effective coverage is the gate)"
    silent: false

  coverage-effective:
    desc: Compute effective coverage (100% of coverable lines) excluding NOCOVER-marked defence-in-depth paths.
    deps: [coverage-oss]
    vars:
      LLVM_DIR:
        sh: |
          if command -v llvm-profdata >/dev/null 2>&1; then
            dirname "$(command -v llvm-profdata)"
          elif [ -x /opt/homebrew/opt/llvm/bin/llvm-profdata ]; then
            echo /opt/homebrew/opt/llvm/bin
          elif [ -x /usr/local/opt/llvm/bin/llvm-profdata ]; then
            echo /usr/local/opt/llvm/bin
          fi
    cmds:
      - |
        {{.LLVM_DIR}}/llvm-cov export build/coverage-oss/test_lunalink \
          -instr-profile=build/coverage-oss/lunalink.profdata \
          -ignore-filename-regex='_deps|tests' \
          -format=lcov > build/coverage-oss/coverage.lcov
      - python3 scripts/effective_coverage.py --lcov build/coverage-oss/coverage.lcov --src cpp/ --path-prefix "build/coverage-oss/" --json build/coverage-oss/effective.json
    silent: false

  coverage-report:
    desc: Generate structured coverage evidence report (RST + JSON) from existing coverage data.
    cmds:
      - python3 scripts/coverage_evidence_report.py --build-dir build/coverage
    silent: false

  sanitize:
    desc: Build and run C++ tests with AddressSanitizer and UBSan.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
    cmds:
      - cmake -B build/sanitize -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - cmake --build build/sanitize --parallel
      - ctest --test-dir build/sanitize --output-on-failure --parallel
    silent: false

  tidy:
    desc: Run clang-tidy static analysis on C++ core (requires clang-tidy).
    env:
      SDKROOT:
        sh: command -v xcrun >/dev/null 2>&1 && xcrun --show-sdk-path || true
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      TIDY_JOBS:
        sh: |
          if command -v sysctl >/dev/null 2>&1 && [ -n "$(sysctl -n hw.ncpu 2>/dev/null)" ]; then
            sysctl -n hw.ncpu 2>/dev/null
          elif command -v nproc >/dev/null 2>&1; then
            nproc
          else
            echo 4
          fi
      CLANG_TIDY:
        sh: |
          if command -v clang-tidy >/dev/null 2>&1; then
            command -v clang-tidy
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-tidy ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-tidy
          elif [ -x /usr/local/opt/llvm/bin/clang-tidy ]; then
            echo /usr/local/opt/llvm/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/clang-tidy ]; then
            echo /opt/homebrew/bin/clang-tidy
          elif [ -x /usr/local/bin/clang-tidy ]; then
            echo /usr/local/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/brew ] && [ -x "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy"
          elif [ -x /usr/local/bin/brew ] && [ -x "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy"
          fi
    cmds:
      - cmake -B build/tidy -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - |
        if [ -z "{{.CLANG_TIDY}}" ]; then
          echo "clang-tidy not found; skipping tidy. Install LLVM (for example: brew install llvm) to enable this task."
          exit 0
        fi
        find cpp/ -name '*.cpp' ! -path '*/bindings/*' ! -path '*/tests/*' -print0 | xargs -0 -n 1 -P "{{.TIDY_JOBS}}" "{{.CLANG_TIDY}}" -p build/tidy -quiet --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-error=unknown-warning-option
    silent: false

  tidy-staged:
    desc: Run clang-tidy only on staged C++ source files (fast, for pre-commit).
    env:
      SDKROOT:
        sh: command -v xcrun >/dev/null 2>&1 && xcrun --show-sdk-path || true
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      TIDY_JOBS:
        sh: |
          if command -v sysctl >/dev/null 2>&1 && [ -n "$(sysctl -n hw.ncpu 2>/dev/null)" ]; then
            sysctl -n hw.ncpu 2>/dev/null
          elif command -v nproc >/dev/null 2>&1; then
            nproc
          else
            echo 4
          fi
      CLANG_TIDY:
        sh: |
          if command -v clang-tidy >/dev/null 2>&1; then
            command -v clang-tidy
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-tidy ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-tidy
          elif [ -x /usr/local/opt/llvm/bin/clang-tidy ]; then
            echo /usr/local/opt/llvm/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/clang-tidy ]; then
            echo /opt/homebrew/bin/clang-tidy
          elif [ -x /usr/local/bin/clang-tidy ]; then
            echo /usr/local/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/brew ] && [ -x "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy"
          elif [ -x /usr/local/bin/brew ] && [ -x "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy"
          fi
    cmds:
      - |
        if [ -z "{{.CLANG_TIDY}}" ]; then
          echo "clang-tidy not found; skipping tidy. Install LLVM (for example: brew install llvm) to enable this task."
          exit 0
        fi
        # Collect staged .cpp source files (exclude bindings and tests)
        STAGED=$(git diff --cached --name-only --diff-filter=ACM -- 'cpp/codes/*.cpp' 'cpp/encoding/*.cpp' 'cpp/messages/*.cpp' 'cpp/signal/*.cpp' 'cpp/platform/*.cpp' 'cpp/proprietary/codes/*.cpp' 'cpp/proprietary/signal/*.hpp' 'cpp/include/*.hpp')
        if [ -z "$STAGED" ]; then
          echo "No staged C++ source files — skipping tidy."
          exit 0
        fi
        echo "Running clang-tidy on $(echo "$STAGED" | wc -l | tr -d ' ') staged file(s)..."
        # Ensure compile_commands.json exists (reuse tidy build dir)
        if [ ! -f build/tidy/compile_commands.json ]; then
          cmake -B build/tidy -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        fi
        echo "$STAGED" | xargs -n 1 -P "{{.TIDY_JOBS}}" "{{.CLANG_TIDY}}" -p build/tidy -quiet --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-error=unknown-warning-option
    silent: false

  metrics:
    desc: Run radon to report cyclomatic complexity and maintainability index.
    cmds:
      - uv run radon cc src/ -s
      - uv run radon mi src/ -s
    silent: false

  swifi:
    desc: Build and run SWIFI fault-injection test suite (requires LUNALINK_FAULT_INJECTION=ON).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/swifi-ninja" || echo "build/swifi-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DLUNALINK_FAULT_INJECTION=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/lunalink_swifi_tests --reporter junit::out={{.BUILD_DIR}}/swifi_results.xml --reporter console"
      - python3 scripts/swifi_report.py --xml {{.BUILD_DIR}}/swifi_results.xml
    silent: false

  traceability:
    desc: Verify requirement-to-test traceability (LSIS-AFS / SW-SAF tags).
    cmd: python3 scripts/verify_traceability.py
    silent: false

  compliance-report:
    desc: Generate LSIS-AFS compliance report (JSON artifact + summary table).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - '"{{.BUILD_DIR}}/test_lunalink" -r junit -o build/test_results.xml "~[wcet]~[channel]~[e2e]"'
      - '"{{.BUILD_DIR}}/test_lunalink" -r junit -o build/test_e2e.xml "[e2e]"'
      - task: swifi
      - python3 scripts/compliance_report.py
    silent: false

  stack-usage:
    desc: Build with -fstack-usage and generate stack usage evidence artifact.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/stack-usage-ninja" || echo "build/stack-usage-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DENABLE_STACK_USAGE=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - python3 scripts/stack_usage_report.py --build-dir {{.BUILD_DIR}} --max-single 4096
    silent: false

  build-manifest:
    desc: Generate build manifest with binary hashes, compiler info, and flags.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - python3 scripts/build_manifest.py --build-dir {{.BUILD_DIR}}
    silent: false

  validate-tidy:
    desc: Run tool validation suite — prove clang-tidy catches claimed MISRA violations (ECSS-Q-ST-80C §5.5).
    vars:
      CLANG_TIDY:
        sh: |
          if command -v clang-tidy >/dev/null 2>&1; then
            command -v clang-tidy
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-tidy ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-tidy
          elif [ -x /usr/local/opt/llvm/bin/clang-tidy ]; then
            echo /usr/local/opt/llvm/bin/clang-tidy
          fi
    cmds:
      - |
        if [ -z "{{.CLANG_TIDY}}" ]; then
          echo "clang-tidy not found; skipping. Install LLVM: brew install llvm"
          exit 0
        fi
        python3 scripts/validate_tidy.py --clang-tidy "{{.CLANG_TIDY}}"
    silent: false

  validate-coverage:
    desc: Run coverage tool validation — prove llvm-cov correctly reports known gaps (ECSS-Q-ST-80C §5.5).
    vars:
      LLVM_DIR:
        sh: |
          if command -v llvm-cov >/dev/null 2>&1; then
            dirname "$(command -v llvm-cov)"
          elif [ -x /opt/homebrew/opt/llvm/bin/llvm-cov ]; then
            echo /opt/homebrew/opt/llvm/bin
          elif [ -x /usr/local/opt/llvm/bin/llvm-cov ]; then
            echo /usr/local/opt/llvm/bin
          fi
    cmds:
      - |
        if [ -z "{{.LLVM_DIR}}" ]; then
          echo "LLVM not found; skipping. Install LLVM: brew install llvm"
          exit 0
        fi
        python3 scripts/validate_coverage.py --llvm-dir "{{.LLVM_DIR}}"
    silent: false

  check-flags:
    desc: Verify required/forbidden compiler flags in compile_commands.json (S10 gate).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - uv run python scripts/check_build_flags.py {{.BUILD_DIR}}/compile_commands.json
    silent: false

  docs-build:
    desc: Execute notebooks and build the HTML documentation with Sphinx.
    cmds:
      - uv run jupyter nbconvert --to notebook --execute --inplace docs/notebooks/*.ipynb
      - uv run python -m sphinx -b html docs/ docs/_build/html -W
    silent: false

  docs-pdf:
    desc: Build the PDF documentation with Sphinx and xelatex.
    vars:
      TEXLIVE:
        sh: |
          if command -v latexmk >/dev/null 2>&1; then
            echo ""
          elif [ -d /usr/local/texlive/2026/bin/universal-darwin ]; then
            echo "/usr/local/texlive/2026/bin/universal-darwin"
          elif [ -d /usr/local/texlive/2025/bin/universal-darwin ]; then
            echo "/usr/local/texlive/2025/bin/universal-darwin"
          fi
    cmds:
      - uv run python -m sphinx -b latex docs/ docs/_build/latex
      - |
        if [ -n "{{.TEXLIVE}}" ]; then
          export PATH="{{.TEXLIVE}}:$PATH"
        fi
        if ! command -v latexmk >/dev/null 2>&1; then
          echo "latexmk not found; LaTeX files are in docs/_build/latex/ but cannot build PDF."
          echo "Install TeX Live (e.g. brew install --cask mactex) to enable PDF builds."
          exit 1
        fi
        make -C docs/_build/latex
      - echo "PDF built at docs/_build/latex/LunaLink-Gateway0-Phase1.pdf"
    silent: false

  paper:
    desc: "Build a paper PDF. Usage: task paper -- lugre_characterisation"
    cmds:
      - |
        PAPER_DIR="docs/papers/{{.CLI_ARGS}}"
        if [ ! -f "$PAPER_DIR/main.tex" ]; then
          echo "Paper not found: $PAPER_DIR/main.tex"
          echo "Available papers:"
          ls -d docs/papers/*/main.tex 2>/dev/null | sed 's|docs/papers/||;s|/main.tex||'
          exit 1
        fi
        cd "$PAPER_DIR" && latexmk -pdf -interaction=nonstopmode main.tex
        echo "PDF built at $PAPER_DIR/main.pdf"
    silent: false

  paper-clean:
    desc: "Clean paper build artifacts. Usage: task paper-clean -- lugre_characterisation"
    cmds:
      - cd "docs/papers/{{.CLI_ARGS}}" && latexmk -C
    silent: false

  docs-serve:
    desc: Serve the documentation locally with auto-reload.
    cmds:
      - uv run sphinx-autobuild docs/ docs/_build/html
    silent: false

  clean:
    desc: Remove build artefacts (build/, docs/_build/).
    cmds:
      - rm -rf build/ docs/_build/
    silent: false

  pre-commit:
    desc: Fast pre-commit checks (build, lint, test, incremental tidy).
    cmds:
      - task: build
      - task: lint-check
      - task: tidy-staged
      - task: test-cpp
      - task: test-py

  pre-push:
    desc: Pre-push checks (coverage threshold gate, docs build).
    cmds:
      - task: coverage-cpp
      - task: docs-build
    silent: false

  ci-checks:
    desc: Full CI gate — replaces all GitHub Actions workflows locally (excludes BER/WCET, run those with `task performance`).
    cmds:
      - task: build
      - task: lint-check
      - task: format-cpp-check
      - task: clang-sa
      - task: check-flags
      - task: test-cpp
      - task: swifi
      - task: traceability
      - task: coverage-cpp
      - task: tidy
      - task: validate-tidy
      - task: validate-coverage
      - task: test-py
      - task: sanitize
      - task: docs-build
      - task: validate-export
    silent: false

  recertify:
    desc: >-
      Run all recertification gates locally and write
      docs/assurance/private/recertification_record.rst.
      Override defaults with: MILESTONE=PDR REASON="..." AUTHORITY="..."
    vars:
      MILESTONE: '{{default "Periodic" .MILESTONE}}'
      REASON: '{{default "Local recertification run" .REASON}}'
      AUTHORITY: '{{default "" .AUTHORITY}}'
    cmd: >-
      bash scripts/recertify_local.sh
      --milestone "{{.MILESTONE}}"
      --reason "{{.REASON}}"
      --authority "{{.AUTHORITY}}"
    silent: false

  export-oss:
    desc: Export an open-source-clean copy of the repository.
    cmd: uv run python scripts/export_oss.py --output-dir build/oss-export

  validate-export:
    desc: Export and validate the OSS-clean copy (no private content, Sphinx builds clean).
    cmds:
      - task: export-oss
      - |
        echo "=== Validating OSS export ==="
        EXPORT_DIR="build/oss-export"

        # No private/ directories
        if find "$EXPORT_DIR" -type d -name private 2>/dev/null | grep -q .; then
          echo "FAIL: private/ directories found in export"
          find "$EXPORT_DIR" -type d -name private
          exit 1
        fi
        echo "PASS: no private/ directories"

        # No confidential markers (marker split to avoid self-match)
        MARKER="[[""Confidential - Not for OpenSource""]]"
        if grep -rF "$MARKER" "$EXPORT_DIR/" --include='*.rst' --include='*.md' --include='*.py' --include='*.yml' --include='*.toml' --include='*.hpp' --include='*.cpp' 2>/dev/null; then
          echo "FAIL: confidential markers found"
          exit 1
        fi
        echo "PASS: no confidential markers"

        # No private-begin/end blocks
        if grep -r '\[\[private-begin\]\]' "$EXPORT_DIR/" 2>/dev/null || \
           grep -r '\[\[private-end\]\]' "$EXPORT_DIR/" 2>/dev/null; then
          echo "FAIL: private block markers found"
          exit 1
        fi
        echo "PASS: no private block markers"

        # No CLAUDE.md
        if find "$EXPORT_DIR" -name "CLAUDE.md" | grep -q .; then
          echo "FAIL: CLAUDE.md found in export"
          exit 1
        fi
        echo "PASS: no CLAUDE.md"

        # No shaping/ docs
        if find "$EXPORT_DIR" -type d -name shaping | grep -q .; then
          echo "FAIL: shaping/ directories found"
          exit 1
        fi
        echo "PASS: no shaping/ directories"

        # README.md exists
        if [ ! -f "$EXPORT_DIR/README.md" ]; then
          echo "FAIL: README.md not found"
          exit 1
        fi
        echo "PASS: README.md present"

        # No SWIFI test files
        if find "$EXPORT_DIR" -name "test_swifi*" | grep -q .; then
          echo "FAIL: SWIFI test files found in export"
          find "$EXPORT_DIR" -name "test_swifi*"
          exit 1
        fi
        echo "PASS: no SWIFI test files"

        # No fault injection guard in C++ source or headers (split to avoid self-match)
        FI_GUARD="LUNALINK_FAULT""_INJECTION"
        if grep -r "$FI_GUARD" "$EXPORT_DIR/" --include='*.hpp' --include='*.cpp' --include='*.h' 2>/dev/null; then
          echo "FAIL: $FI_GUARD references found in C++ code"
          exit 1
        fi
        echo "PASS: no SWIFI instrumentation in C++ code"

        # No fault injection guard in CMake/build files
        if grep -r "$FI_GUARD" "$EXPORT_DIR/" --include='CMakeLists.txt' --include='*.cmake' 2>/dev/null; then
          echo "FAIL: $FI_GUARD references found in CMake files"
          exit 1
        fi
        echo "PASS: no SWIFI references in build system"

        # No proprietary/ directories
        if find "$EXPORT_DIR" -type d -name proprietary 2>/dev/null | grep -q .; then
          echo "FAIL: proprietary/ directories found in export"
          find "$EXPORT_DIR" -type d -name proprietary
          exit 1
        fi
        echo "PASS: no proprietary/ directories"

        # No receiver Python package (src/lunalink/receiver/)
        if [ -d "$EXPORT_DIR/src/lunalink/receiver" ]; then
          echo "FAIL: src/lunalink/receiver/ found in export"
          exit 1
        fi
        echo "PASS: no receiver package"

        # No proprietary test file
        if find "$EXPORT_DIR" -name "test_receiver.py" | grep -q .; then
          echo "FAIL: test_receiver.py found in export"
          exit 1
        fi
        echo "PASS: no proprietary test files"

        echo "=== All export validation checks passed ==="
      - |
        echo "Building Sphinx docs in exported tree..."
        cd build/oss-export
        uv sync --group dev
        uv run python -m sphinx -b html docs/ docs/_build/html -W
        echo "PASS: Sphinx build succeeded (zero warnings)"

  # [[private-begin]]
  # --- Private tasks (not included in OSS export) ---
  # inference-test:
  #   desc: Run inference engine tests.
  #   cmd: echo "Not yet implemented"
  # integrity-test:
  #   desc: Run integrity monitoring tests.
  #   cmd: echo "Not yet implemented"
  # [[private-end]]

  format-cpp:
    desc: Format all C++ source files with clang-format.
    vars:
      CLANG_FORMAT:
        sh: |
          if command -v clang-format >/dev/null 2>&1; then
            command -v clang-format
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-format ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-format
          elif [ -x /usr/local/opt/llvm/bin/clang-format ]; then
            echo /usr/local/opt/llvm/bin/clang-format
          fi
    cmds:
      - |
        if [ -z "{{.CLANG_FORMAT}}" ]; then
          echo "clang-format not found. Install LLVM: brew install llvm"
          exit 1
        fi
        find cpp/ -name '*.cpp' -o -name '*.hpp' | grep -v _deps | \
          xargs "{{.CLANG_FORMAT}}" -i
        echo "Formatted $(find cpp/ -name '*.cpp' -o -name '*.hpp' | grep -v _deps | wc -l | tr -d ' ') files"

  format-cpp-check:
    desc: Check C++ formatting without modifying files (CI gate).
    vars:
      CLANG_FORMAT:
        sh: |
          if command -v clang-format >/dev/null 2>&1; then
            command -v clang-format
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-format ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-format
          elif [ -x /usr/local/opt/llvm/bin/clang-format ]; then
            echo /usr/local/opt/llvm/bin/clang-format
          fi
    cmds:
      - |
        if [ -z "{{.CLANG_FORMAT}}" ]; then
          echo "clang-format not found. Install LLVM: brew install llvm"
          exit 1
        fi
        VIOLATIONS=$(find cpp/ -name '*.cpp' -o -name '*.hpp' | grep -v _deps | \
          xargs "{{.CLANG_FORMAT}}" --dry-run --Werror 2>&1 | grep -c 'warning:' || true)
        if [ "$VIOLATIONS" -gt 0 ]; then
          echo "FAIL: $VIOLATIONS formatting violations found. Run: task format-cpp"
          exit 1
        fi
        echo "PASS: all C++ files correctly formatted"

  clang-sa:
    desc: Run Clang Static Analyzer (path-sensitive analysis, ECSS-Q-ST-80C §5.5).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      SCAN_BUILD:
        sh: |
          if command -v scan-build >/dev/null 2>&1; then
            command -v scan-build
          elif [ -x /opt/homebrew/opt/llvm/bin/scan-build ]; then
            echo /opt/homebrew/opt/llvm/bin/scan-build
          elif [ -x /usr/local/opt/llvm/bin/scan-build ]; then
            echo /usr/local/opt/llvm/bin/scan-build
          fi
    cmds:
      - |
        if [ -z "{{.SCAN_BUILD}}" ]; then
          echo "scan-build not found. Install LLVM: brew install llvm"
          exit 1
        fi
        echo "=== Clang Static Analyzer (ECSS-Q-ST-80C §5.5) ==="
        mkdir -p build/clang-sa
        cmake -B build/clang-sa -S . -G "{{.GENERATOR}}" \
          -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=OFF \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        "{{.SCAN_BUILD}}" \
          --use-cc=clang --use-c++=clang++ \
          -o build/clang-sa/report \
          --status-bugs \
          -enable-checker core \
          -enable-checker deadcode \
          -enable-checker security \
          -enable-checker unix \
          -enable-checker cplusplus \
          -enable-checker nullability \
          cmake --build build/clang-sa --target lunalink_core --parallel
        echo "PASS: Clang Static Analyzer found no bugs"
    silent: false

  iwyu:
    desc: Run include-what-you-use on C++ core (header hygiene).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      IWYU:
        sh: |
          if command -v include-what-you-use >/dev/null 2>&1; then
            command -v include-what-you-use
          elif command -v iwyu >/dev/null 2>&1; then
            command -v iwyu
          fi
    cmds:
      - |
        if [ -z "{{.IWYU}}" ]; then
          echo "include-what-you-use not found."
          echo "Install: brew install include-what-you-use  (or: apt install iwyu)"
          echo "Skipping."
          exit 0
        fi
        cmake -B build/iwyu -S . -G "{{.GENERATOR}}" \
          -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=OFF \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE="{{.IWYU}};-Xiwyu;--no_fwd_decls;-Xiwyu;--cxx17ns"
        cmake --build build/iwyu --parallel 2>&1 | tee build/iwyu/iwyu_output.txt
        echo ""
        echo "IWYU suggestions written to build/iwyu/iwyu_output.txt"
        echo "Review and apply selectively — IWYU is advisory, not a gate."
    silent: false

  cross-arch:
    desc: Build and test C++ core on arm64 + s390x via Docker buildx + QEMU emulation.
    cmd: python3 scripts/cross_arch_test.py

  cross-arch-quick:
    desc: Quick ARM64-only cross-architecture test (skips big-endian).
    cmd: python3 scripts/cross_arch_test.py --arch arm64

  version-tag:
    desc: Create the next patch version tag (use BUMP=minor for minor bump, DRY_RUN=1 to preview).
    vars:
      BUMP: '{{default "patch" .BUMP}}'
      DRY_RUN: '{{default "" .DRY_RUN}}'
      PUSH: '{{default "" .PUSH}}'
    cmd: >-
      python3 scripts/version_tag.py
      {{if eq .BUMP "minor"}}--minor{{end}}
      {{if .DRY_RUN}}--dry-run{{end}}
      {{if .PUSH}}--push{{end}}

  default:
    desc: Run all quality checks (lint, test, docs).
    cmds:
      - task: install
      - task: lint
      - task: test
      - task: docs-build
    silent: false
