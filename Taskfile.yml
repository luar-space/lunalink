version: '3'

tasks:
  install:
    desc: Install or update project dependencies.
    cmd: uv sync --group dev

  build:
    desc: Force recompile the C++ extension.
    cmd: uv sync --group dev --reinstall-package lunalink

  install-hooks:
    desc: Install git hooks for pre-commit checks.
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed. Pre-commit checks will run automatically."

  test:
    desc: Rebuild C++ extension, then run C++ and Python tests.
    cmds:
      - task: build
      - task: test-cpp
      - task: test-py
    silent: false

  test-py:
    desc: Run Python tests.
    cmd: uv run python -m pytest

  wcet:
    desc: Run [wcet]-tagged timing benchmarks (Release), generate wcet_profile.rst + bench.json.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR: build/performance
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BUILD_DIR}} --parallel
      - |
        {{.BUILD_DIR}}/test_lunalink "[wcet]" \
          --reporter "console::out={{.BUILD_DIR}}/wcet_console.txt" \
          --reporter "xml::out={{.BUILD_DIR}}/wcet_results.xml"
      - |
        python3 scripts/performance_report.py \
          --xml {{.BUILD_DIR}}/wcet_results.xml \
          --console {{.BUILD_DIR}}/wcet_console.txt \
          --output {{.BUILD_DIR}}/wcet_profile.rst \
          --bench-json {{.BUILD_DIR}}/bench.json
      - 'echo "WCET profile: {{.BUILD_DIR}}/wcet_profile.rst"'
    silent: false

  ber:
    desc: Run [channel]-tagged simulations (BER/FER sweeps, Pd, Release). Fails on any assertion.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR: build/performance
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/test_lunalink [channel] --reporter console"
    silent: false

  integration:
    desc: Run [e2e]-tagged integration tests (full TX→RX stack, Debug build).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/test_lunalink [e2e] --reporter console"
    silent: false

  performance:
    desc: Run all performance tests — [wcet] timing report + [ber] channel simulations.
    cmds:
      - task: wcet
      - task: ber
    silent: false

  test-cpp:
    desc: Build and run C++ unit tests with CTest (uses Ninja if available).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - cmake --build {{.BUILD_DIR}} --parallel
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure --parallel
    silent: false

  lint:
    desc: Run all static analysis tools (type checking, linting, formatting).
    cmds:
      - task: pyright
      - task: cppcheck
      - task: ruff-fix
    silent: false

  lint-check:
    desc: Run non-mutating lint checks used by CI and pre-commit.
    cmds:
      - task: pyright
      - task: cppcheck
      - uv run ruff format --check .
      - uv run ruff check .
    silent: false

  cppcheck:
    desc: Run cppcheck static analysis on C++ core.
    cmds:
      - |
        if ! command -v cppcheck >/dev/null 2>&1; then
          echo "ERROR: cppcheck not found. Install it: brew install cppcheck"
          exit 1
        fi
        cppcheck --enable=all --inconclusive --inline-suppr --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --suppress=missingInclude \
          --suppress=unusedFunction \
          --suppress=useStlAlgorithm \
          --suppress=checkersReport \
          --suppress=normalCheckLevelMaxBranches \
          --suppress=unmatchedSuppression \
          cpp/include/ cpp/codes/ cpp/encoding/ cpp/messages/ cpp/signal/ cpp/platform/
    silent: false

  pyright:
    desc: Run type checking with pyright.
    cmd: uv run pyright src/

  ruff-fix:
    desc: Run ruff to format and lint with auto-fix.
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix
    silent: false

  coverage-cpp:
    desc: Build and run C++ tests with LLVM-native MC/DC coverage, then generate HTML report.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      LLVM_DIR:
        sh: |
          if command -v llvm-profdata >/dev/null 2>&1; then
            dirname "$(command -v llvm-profdata)"
          elif [ -x /opt/homebrew/opt/llvm/bin/llvm-profdata ]; then
            echo /opt/homebrew/opt/llvm/bin
          elif [ -x /usr/local/opt/llvm/bin/llvm-profdata ]; then
            echo /usr/local/opt/llvm/bin
          fi
    cmds:
      - |
        if [ -z "{{.LLVM_DIR}}" ]; then
          echo "ERROR: LLVM not found. Install it: brew install llvm"
          exit 1
        fi
        echo "Using LLVM from {{.LLVM_DIR}}"
      - cmake -B build/coverage -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_LLVM_COVERAGE=ON -DCMAKE_C_COMPILER={{.LLVM_DIR}}/clang -DCMAKE_CXX_COMPILER={{.LLVM_DIR}}/clang++
      - cmake --build build/coverage --parallel
      - rm -f build/coverage/*.profraw build/coverage/*.profdata
      - LLVM_PROFILE_FILE="lunalink-%m.profraw" ctest --test-dir build/coverage --output-on-failure
      - "{{.LLVM_DIR}}/llvm-profdata merge -sparse build/coverage/*.profraw -o build/coverage/lunalink.profdata"
      - |
        {{.LLVM_DIR}}/llvm-cov show build/coverage/test_lunalink \
          -object build/coverage/lunalink_swifi_tests \
          -instr-profile=build/coverage/lunalink.profdata \
          -format=html -output-dir=build/coverage/html \
          -show-mcdc-summary -show-mcdc \
          -ignore-filename-regex='_deps|tests' \
          "-path-equivalence=build/coverage,$(pwd)"
      - "{{.LLVM_DIR}}/llvm-cov report build/coverage/test_lunalink -object build/coverage/lunalink_swifi_tests -instr-profile=build/coverage/lunalink.profdata -show-mcdc-summary -ignore-filename-regex='_deps|tests'"
      - echo "MC/DC Coverage report generated at build/coverage/html/index.html"
      - |
        LINE_PCT=$({{.LLVM_DIR}}/llvm-cov report build/coverage/test_lunalink \
          -object build/coverage/lunalink_swifi_tests \
          -instr-profile=build/coverage/lunalink.profdata \
          -ignore-filename-regex='_deps|tests' 2>/dev/null | \
          awk '/TOTAL/{for(i=1;i<=NF;i++) if($i ~ /%/) {gsub(/%/,"",$i); print $i; exit}}')
        echo "Line coverage: ${LINE_PCT}%"
        if [ "$(echo "$LINE_PCT < 90" | bc -l)" -eq 1 ]; then
          echo "ERROR: Line coverage ${LINE_PCT}% is below minimum 90%"
          exit 1
        fi
    silent: false

  sanitize:
    desc: Build and run C++ tests with AddressSanitizer and UBSan.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
    cmds:
      - cmake -B build/sanitize -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - cmake --build build/sanitize --parallel
      - ctest --test-dir build/sanitize --output-on-failure --parallel
    silent: false

  tidy:
    desc: Run clang-tidy static analysis on C++ core (requires clang-tidy).
    env:
      SDKROOT:
        sh: command -v xcrun >/dev/null 2>&1 && xcrun --show-sdk-path || true
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      TIDY_JOBS:
        sh: |
          if command -v sysctl >/dev/null 2>&1 && [ -n "$(sysctl -n hw.ncpu 2>/dev/null)" ]; then
            sysctl -n hw.ncpu 2>/dev/null
          elif command -v nproc >/dev/null 2>&1; then
            nproc
          else
            echo 4
          fi
      CLANG_TIDY:
        sh: |
          if command -v clang-tidy >/dev/null 2>&1; then
            command -v clang-tidy
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-tidy ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-tidy
          elif [ -x /usr/local/opt/llvm/bin/clang-tidy ]; then
            echo /usr/local/opt/llvm/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/clang-tidy ]; then
            echo /opt/homebrew/bin/clang-tidy
          elif [ -x /usr/local/bin/clang-tidy ]; then
            echo /usr/local/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/brew ] && [ -x "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy"
          elif [ -x /usr/local/bin/brew ] && [ -x "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy"
          fi
    cmds:
      - cmake -B build/tidy -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - |
        if [ -z "{{.CLANG_TIDY}}" ]; then
          echo "clang-tidy not found; skipping tidy. Install LLVM (for example: brew install llvm) to enable this task."
          exit 0
        fi
        find cpp/ -name '*.cpp' ! -path '*/bindings/*' ! -path 'cpp/tests/*' -print0 | xargs -0 -n 1 -P "{{.TIDY_JOBS}}" "{{.CLANG_TIDY}}" -p build/tidy -quiet --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-error=unknown-warning-option
    silent: false

  tidy-staged:
    desc: Run clang-tidy only on staged C++ source files (fast, for pre-commit).
    env:
      SDKROOT:
        sh: command -v xcrun >/dev/null 2>&1 && xcrun --show-sdk-path || true
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      TIDY_JOBS:
        sh: |
          if command -v sysctl >/dev/null 2>&1 && [ -n "$(sysctl -n hw.ncpu 2>/dev/null)" ]; then
            sysctl -n hw.ncpu 2>/dev/null
          elif command -v nproc >/dev/null 2>&1; then
            nproc
          else
            echo 4
          fi
      CLANG_TIDY:
        sh: |
          if command -v clang-tidy >/dev/null 2>&1; then
            command -v clang-tidy
          elif [ -x /opt/homebrew/opt/llvm/bin/clang-tidy ]; then
            echo /opt/homebrew/opt/llvm/bin/clang-tidy
          elif [ -x /usr/local/opt/llvm/bin/clang-tidy ]; then
            echo /usr/local/opt/llvm/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/clang-tidy ]; then
            echo /opt/homebrew/bin/clang-tidy
          elif [ -x /usr/local/bin/clang-tidy ]; then
            echo /usr/local/bin/clang-tidy
          elif [ -x /opt/homebrew/bin/brew ] && [ -x "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/opt/homebrew/bin/brew --prefix llvm)/bin/clang-tidy"
          elif [ -x /usr/local/bin/brew ] && [ -x "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy" ]; then
            echo "$(/usr/local/bin/brew --prefix llvm)/bin/clang-tidy"
          fi
    cmds:
      - |
        if [ -z "{{.CLANG_TIDY}}" ]; then
          echo "clang-tidy not found; skipping tidy. Install LLVM (for example: brew install llvm) to enable this task."
          exit 0
        fi
        # Collect staged .cpp source files (exclude bindings and tests)
        STAGED=$(git diff --cached --name-only --diff-filter=ACM -- 'cpp/codes/*.cpp' 'cpp/encoding/*.cpp' 'cpp/messages/*.cpp' 'cpp/signal/*.cpp' 'cpp/platform/*.cpp' 'cpp/include/*.hpp')
        if [ -z "$STAGED" ]; then
          echo "No staged C++ source files — skipping tidy."
          exit 0
        fi
        echo "Running clang-tidy on $(echo "$STAGED" | wc -l | tr -d ' ') staged file(s)..."
        # Ensure compile_commands.json exists (reuse tidy build dir)
        if [ ! -f build/tidy/compile_commands.json ]; then
          cmake -B build/tidy -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        fi
        echo "$STAGED" | xargs -n 1 -P "{{.TIDY_JOBS}}" "{{.CLANG_TIDY}}" -p build/tidy -quiet --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-error=unknown-warning-option
    silent: false

  metrics:
    desc: Run radon to report cyclomatic complexity and maintainability index.
    cmds:
      - uv run radon cc src/ -s
      - uv run radon mi src/ -s
    silent: false

  swifi:
    desc: Build and run SWIFI fault-injection test suite (requires LUNALINK_FAULT_INJECTION=ON).
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/swifi-ninja" || echo "build/swifi-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DLUNALINK_FAULT_INJECTION=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - "{{.BUILD_DIR}}/lunalink_swifi_tests --reporter junit::out={{.BUILD_DIR}}/swifi_results.xml --reporter console"
      - python3 scripts/swifi_report.py --xml {{.BUILD_DIR}}/swifi_results.xml
    silent: false

  traceability:
    desc: Verify requirement-to-test traceability (LSIS-AFS / SW-SAF tags).
    cmd: python3 scripts/verify_traceability.py
    silent: false

  stack-usage:
    desc: Build with -fstack-usage and generate stack usage evidence artifact.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/stack-usage-ninja" || echo "build/stack-usage-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DENABLE_STACK_USAGE=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - python3 scripts/stack_usage_report.py --build-dir {{.BUILD_DIR}} --max-single 4096
    silent: false

  build-manifest:
    desc: Generate build manifest with binary hashes, compiler info, and flags.
    vars:
      GENERATOR:
        sh: which ninja >/dev/null 2>&1 && echo "Ninja" || echo "Unix Makefiles"
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -G "{{.GENERATOR}}" -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - cmake --build {{.BUILD_DIR}} --parallel
      - python3 scripts/build_manifest.py --build-dir {{.BUILD_DIR}}
    silent: false

  check-flags:
    desc: Verify required/forbidden compiler flags in compile_commands.json (S10 gate).
    vars:
      BUILD_DIR:
        sh: which ninja >/dev/null 2>&1 && echo "build/cpp-tests-ninja" || echo "build/cpp-tests-make"
    cmds:
      - uv run python scripts/check_build_flags.py {{.BUILD_DIR}}/compile_commands.json
    silent: false

  docs-build:
    desc: Build the HTML documentation with Sphinx.
    cmds:
      - uv run python -m sphinx -b html docs/ docs/_build/html -W
    silent: false

  docs-pdf:
    desc: Build the PDF documentation with Sphinx and xelatex.
    vars:
      TEXLIVE:
        sh: |
          if command -v latexmk >/dev/null 2>&1; then
            echo ""
          elif [ -d /usr/local/texlive/2026/bin/universal-darwin ]; then
            echo "/usr/local/texlive/2026/bin/universal-darwin"
          elif [ -d /usr/local/texlive/2025/bin/universal-darwin ]; then
            echo "/usr/local/texlive/2025/bin/universal-darwin"
          fi
    cmds:
      - uv run python -m sphinx -b latex docs/ docs/_build/latex
      - |
        if [ -n "{{.TEXLIVE}}" ]; then
          export PATH="{{.TEXLIVE}}:$PATH"
        fi
        if ! command -v latexmk >/dev/null 2>&1; then
          echo "latexmk not found; LaTeX files are in docs/_build/latex/ but cannot build PDF."
          echo "Install TeX Live (e.g. brew install --cask mactex) to enable PDF builds."
          exit 1
        fi
        make -C docs/_build/latex
      - echo "PDF built at docs/_build/latex/LunaLink-Gateway0-Phase1.pdf"
    silent: false

  docs-serve:
    desc: Serve the documentation locally with auto-reload.
    cmds:
      - uv run sphinx-autobuild docs/ docs/_build/html
    silent: false

  clean:
    desc: Remove build artefacts (build/, docs/_build/).
    cmds:
      - rm -rf build/ docs/_build/
    silent: false

  pre-commit:
    desc: Fast pre-commit checks (build, lint, test, incremental tidy).
    cmds:
      - task: build
      - task: lint-check
      - task: tidy-staged
      - task: test-cpp
      - task: test-py

  pre-push:
    desc: Pre-push checks (coverage threshold gate, docs build).
    cmds:
      - task: coverage-cpp
      - task: docs-build
    silent: false

  ci-checks:
    desc: Full CI gate — replaces all GitHub Actions workflows locally (excludes BER/WCET, run those with `task performance`).
    cmds:
      - task: build
      - task: lint-check
      - task: check-flags
      - task: test-cpp
      - task: integration
      - task: swifi
      - task: traceability
      - task: coverage-cpp
      - task: tidy
      - task: test-py
      - task: sanitize
      - task: docs-build
      - task: validate-export
    silent: false

  recertify:
    desc: >-
      Run all recertification gates locally and write
      docs/assurance/private/recertification_record.rst.
      Override defaults with: MILESTONE=PDR REASON="..." AUTHORITY="..."
    vars:
      MILESTONE: '{{default "Periodic" .MILESTONE}}'
      REASON: '{{default "Local recertification run" .REASON}}'
      AUTHORITY: '{{default "" .AUTHORITY}}'
    cmd: >-
      bash scripts/recertify_local.sh
      --milestone "{{.MILESTONE}}"
      --reason "{{.REASON}}"
      --authority "{{.AUTHORITY}}"
    silent: false

  export-oss:
    desc: Export an open-source-clean copy of the repository.
    cmd: uv run python scripts/export_oss.py --output-dir build/oss-export

  validate-export:
    desc: Export and validate the OSS-clean copy (no private content, Sphinx builds clean).
    cmds:
      - task: export-oss
      - |
        echo "=== Validating OSS export ==="
        EXPORT_DIR="build/oss-export"

        # No private/ directories
        if find "$EXPORT_DIR" -type d -name private 2>/dev/null | grep -q .; then
          echo "FAIL: private/ directories found in export"
          find "$EXPORT_DIR" -type d -name private
          exit 1
        fi
        echo "PASS: no private/ directories"

        # No confidential markers
        MARKER='[[Confidential - Not for OpenSource]]'
        if grep -rF "$MARKER" "$EXPORT_DIR/" --include='*.rst' --include='*.md' --include='*.py' --include='*.yml' --include='*.toml' --include='*.hpp' --include='*.cpp' 2>/dev/null; then
          echo "FAIL: confidential markers found"
          exit 1
        fi
        echo "PASS: no confidential markers"

        # No private-begin/end blocks
        if grep -r '\[\[private-begin\]\]' "$EXPORT_DIR/" 2>/dev/null || \
           grep -r '\[\[private-end\]\]' "$EXPORT_DIR/" 2>/dev/null; then
          echo "FAIL: private block markers found"
          exit 1
        fi
        echo "PASS: no private block markers"

        # No CLAUDE.md
        if find "$EXPORT_DIR" -name "CLAUDE.md" | grep -q .; then
          echo "FAIL: CLAUDE.md found in export"
          exit 1
        fi
        echo "PASS: no CLAUDE.md"

        # No shaping/ docs
        if find "$EXPORT_DIR" -type d -name shaping | grep -q .; then
          echo "FAIL: shaping/ directories found"
          exit 1
        fi
        echo "PASS: no shaping/ directories"

        # README.md exists
        if [ ! -f "$EXPORT_DIR/README.md" ]; then
          echo "FAIL: README.md not found"
          exit 1
        fi
        echo "PASS: README.md present"

        echo "=== All export validation checks passed ==="
      - |
        echo "Building Sphinx docs in exported tree..."
        cd build/oss-export
        uv sync --group dev
        uv run python -m sphinx -b html docs/ docs/_build/html -W
        echo "PASS: Sphinx build succeeded (zero warnings)"

  # [[private-begin]]
  # --- Private tasks (not included in OSS export) ---
  # inference-test:
  #   desc: Run inference engine tests.
  #   cmd: echo "Not yet implemented"
  # integrity-test:
  #   desc: Run integrity monitoring tests.
  #   cmd: echo "Not yet implemented"
  # [[private-end]]

  default:
    desc: Run all quality checks (lint, test, docs).
    cmds:
      - task: install
      - task: lint
      - task: test
      - task: docs-build
    silent: false
