# cppcheck.cfg — Cppcheck configuration documentation for LunaLink flight code.
#
# Cppcheck does not use a project file for CLI invocations. This file documents
# the configuration applied via command-line flags in Taskfile.yml and CI.
#
# Part of the static analysis evidence chain for ECSS-Q-ST-80C §5.5 compliance.
# This configuration complements clang-tidy (primary MISRA enforcement) with
# independent bug-finding analysis.
#
# Standards traceability:
#   ECSS-Q-ST-80C §5.5   — requires independent static analysis
#   NASA SWE-108          — static analysis requirement
#   Power of Ten Rule 10  — multiple static analysers
#   MISRA Compliance:2020 — recommends multiple tools to reduce false negatives
#
# Effective configuration (applied in Taskfile.yml `cppcheck` task):
#   --std=c++20           — C++20 language standard
#   --platform=unix64     — 64-bit Unix platform model
#   --enable=all          — all check categories (style, performance, portability,
#                           information, warning, unusedFunction)
#   --inconclusive        — report even when analysis is uncertain
#   --inline-suppr        — honour // cppcheck-suppress comments in source
#   --error-exitcode=1    — non-zero exit on any finding (CI gate)
#   --suppressions-list=cppcheck.suppressions — project-level suppressions
#
# Scanned paths:
#   cpp/include/   — public headers
#   cpp/codes/     — error correction codes
#   cpp/encoding/  — encoding/modulation
#   cpp/messages/  — message framing
#   cpp/signal/    — signal processing (correlator, FFT, etc.)
#   cpp/platform/  — platform abstraction layer
#
# Excluded paths (not scanned):
#   cpp/bindings/  — nanobind wrappers (third-party template noise)
#   cpp/tests/     — test code (different coding standard)
#   build/         — generated files
#
# Suppression policy:
#   All suppressions are documented in cppcheck.suppressions with justification.
#   Suppressions are reviewed as part of the MISRA GCS (LUNALINK-MISRA-GCS-001).
#
# MISRA addon note:
#   The MISRA C++:2023 addon requires Cppcheck Premium (paid licence).
#   MISRA enforcement is handled by clang-tidy instead (see .clang-tidy).
#   Cppcheck's role is complementary bug-finding to reduce false negatives.
#
# Run locally:  task cppcheck
# Run in CI:    lint job in .github/workflows/lint.yml
